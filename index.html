<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Trade</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

/* ===== BASE ===== */
body{
  margin:0;
  font-family:Arial;
  background:#05070d;
  color:#e5e7eb;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  padding:15px 25px;
  background:#0b0f1a;
  border-bottom:1px solid #1f2937;
}

.logo{
  font-weight:bold;
  color:#d4af37; /* GOLD */
}

/* LANGUAGE */
select{
  padding:8px;
  background:#111827;
  color:white;
  border:1px solid #1f2937;
  border-radius:8px;
}

/* PAGES */
.page{
  display:none;
  padding:30px;
}
.active{display:block}

/* BUTTONS */
.btn{
  padding:14px 20px;
  margin:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#111827;
  color:#e5e7eb;
  border:1px solid #1f2937;
  transition:0.2s;
}

.btn:hover{
  background:#1f2937;
  border-color:#d4af37;
}

/* GRID SIDE BY SIDE */
.grid{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.card{
  flex:1;
  min-width:300px;
  background:#0b0f1a;
  padding:20px;
  border-radius:12px;
  border:1px solid #1f2937;
}

/* TITLES */
h1,h2{
  margin-bottom:15px;
}

/* BACK BUTTON */
.back{
  margin-bottom:20px;
}

/* MEDIA */
video,audio{
  width:100%;
  margin-top:10px;
  border-radius:10px;
}

/* LIVE */
.live{
  background:#020617;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}

</style>
</head>

<body>

<div class="header">
<div class="logo">Global Trade</div>

<select onchange="changeLang(this.value)">
<option value="en">English</option>
<option value="ar">العربية</option>
</select>
</div>

<!-- ===== LANDING PAGE (CLEAN) ===== -->
<div id="home" class="page active">

<h1 id="title">Dashboard</h1>

<div style="display:flex;flex-wrap:wrap;gap:20px;">

<button class="btn" onclick="go('stocks')">Stocks</button>
<button class="btn" onclick="go('crypto')">Crypto</button>
<button class="btn" onclick="go('gold')">Gold & Oil</button>
<button class="btn" onclick="go('learn')">Learn Trading</button>
<button class="btn" onclick="go('send')">Send Money</button>

</div>

</div>

<!-- ===== STOCKS PAGE ===== -->
<div id="stocks" class="page">
<button class="btn back" onclick="go('home')">← Back</button>

<h2>Stocks</h2>

<div class="grid">

<div class="card">
<div id="stockChart" style="height:400px;"></div>
</div>

<div class="card">
<h3>Actions</h3>
<button class="btn">Buy</button>
<button class="btn">Sell</button>
</div>

</div>

</div>

<!-- ===== CRYPTO PAGE ===== -->
<div id="crypto" class="page">
<button class="btn back" onclick="go('home')">← Back</button>

<h2>Crypto</h2>

<div class="grid">

<div class="card">
<div id="cryptoChart" style="height:400px;"></div>
</div>

<div class="card">
<h3>Actions</h3>
<button class="btn">Buy</button>
<button class="btn">Sell</button>
</div>

</div>

</div>

<!-- ===== GOLD / OIL ===== -->
<div id="gold" class="page">
<button class="btn back" onclick="go('home')">← Back</button>

<h2>Gold & Oil</h2>

<div class="grid">

<div class="card">
<div id="goldPrice" class="live"></div>
<div id="oilPrice" class="live"></div>
</div>

</div>

</div>

<!-- ===== LEARN ===== -->
<div id="learn" class="page">
<button class="btn back" onclick="go('home')">← Back</button>

<h2>Learn Trading</h2>

<div class="grid">

<div class="card">
<video controls>
<source src="https://www.w3schools.com/html/mov_bbb.mp4">
</video>
</div>

<div class="card">
<audio controls>
<source src="https://www.w3schools.com/html/horse.mp3">
</audio>
</div>

</div>

</div>

<!-- ===== SEND MONEY ===== -->
<div id="send" class="page">
<button class="btn back" onclick="go('home')">← Back</button>

<h2>Send Money</h2>

<div class="grid">

<div class="card">
<input placeholder="Amount"><br>
<button class="btn">Send</button>
</div>

</div>

</div>

<script>

/* NAVIGATION */
function go(page){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'))
document.getElementById(page).classList.add('active')

if(page==="stocks"){loadStocks()}
if(page==="crypto"){loadCrypto()}
}

/* CHARTS */
function loadStocks(){
new TradingView.widget({
container_id:"stockChart",
autosize:true,
symbol:"NASDAQ:AAPL",
theme:"dark"
})
}

function loadCrypto(){
new TradingView.widget({
container_id:"cryptoChart",
autosize:true,
symbol:"BINANCE:BTCUSDT",
theme:"dark"
})
}

/* LIVE GOLD/OIL */
setInterval(()=>{
document.getElementById("goldPrice").innerText="Gold: $"+(1900+Math.random()*20).toFixed(2)
document.getElementById("oilPrice").innerText="Oil: $"+(70+Math.random()*5).toFixed(2)
},2000)

/* LANGUAGE (STRUCTURE READY) */
function changeLang(lang){
if(lang==="ar"){
document.getElementById("title").innerText="لوحة التحكم"
}else{
document.getElementById("title").innerText="Dashboard"
}
}

</script>

</body>
</html>

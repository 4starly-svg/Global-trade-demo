<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GT Vanguard | Global Trade LTD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <style>
        .sidebar-active { border-right: 3px solid #1e40af; background: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

<div id="app-root" class="flex h-screen overflow-hidden">
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col">
        <div class="p-6 text-2xl font-black text-blue-800 tracking-tighter">GT VANGUARD</div>
        <nav class="flex-1 px-4 space-y-2">
            <div class="p-3 sidebar-active text-blue-700 font-bold flex items-center gap-3 cursor-pointer">
                <span>Dashboard</span>
            </div>
            <div class="p-3 text-slate-500 hover:bg-slate-50 rounded-lg flex items-center gap-3 cursor-pointer">
                <span>Exchange Engine</span>
            </div>
            <div class="p-3 text-slate-500 hover:bg-slate-50 rounded-lg flex items-center gap-3 cursor-pointer">
                <span>Soccer Intelligence</span>
            </div>
            <div class="p-3 text-slate-500 hover:bg-slate-50 rounded-lg flex items-center gap-3 cursor-pointer">
                <span>Bank Deposits</span>
            </div>
        </nav>
        <div class="p-6 border-t border-slate-100">
            <button onclick="toggleLang()" class="text-sm font-medium text-slate-600">English / العربية</button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold">Institutional Terminal</h1>
                <p class="text-slate-500">Market Status: <span class="text-green-500 font-bold">● ACTIVE</span></p>
            </div>
            <div class="flex gap-4">
                <div class="bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-200">
                    <span class="text-xs text-slate-400 block">USDT/LYD</span>
                    <span class="font-mono font-bold text-blue-600">6.3440</span>
                </div>
                <div class="bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-200">
                    <span class="text-xs text-slate-400 block">GOLD/USD</span>
                    <span class="font-mono font-bold text-amber-600">$2,384.10</span>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-12 gap-6">
            <div class="col-span-8 bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <div class="flex justify-between mb-4">
                    <h2 class="font-bold">Market Intelligence</h2>
                    <select class="text-sm border-none bg-slate-100 rounded-md px-2">
                        <option>BTC/USDT</option>
                        <option>XAU/USD</option>
                    </select>
                </div>
                <div id="tv_engine_container" style="height: 500px;"></div>
            </div>

            <div class="col-span-4 space-y-6">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <h2 class="font-bold mb-4">Trade Execution</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs text-slate-400 uppercase font-bold">Amount (USDT)</label>
                            <input type="number" id="trade-amount" value="1000" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="p-3 bg-blue-50 rounded-xl text-sm">
                            <div class="flex justify-between">
                                <span>Total LYD:</span>
                                <span class="font-bold" id="calc-lyd">6,344.00</span>
                            </div>
                        </div>
                        <button onclick="executeOrder('BUY')" class="w-full py-4 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                            EXECUTE BUY ORDER
                        </button>
                    </div>
                </div>

                <div class="bg-blue-900 text-white rounded-2xl p-6 shadow-xl relative overflow-hidden">
                    <div class="relative z-10">
                        <span class="text-[10px] bg-amber-500 text-black px-2 py-1 rounded font-bold uppercase">AI Prediction</span>
                        <h3 class="mt-2 font-bold">Real Madrid vs Man City</h3>
                        <div class="mt-4 flex justify-between text-sm">
                            <div class="text-center">
                                <div class="text-amber-400 font-bold">68%</div>
                                <div class="text-[10px] opacity-70 uppercase">Home</div>
                            </div>
                            <div class="text-center">
                                <div class="font-bold">20%</div>
                                <div class="text-[10px] opacity-70 uppercase">Draw</div>
                            </div>
                            <div class="text-center">
                                <div class="font-bold">12%</div>
                                <div class="text-[10px] opacity-70 uppercase">Away</div>
                            </div>
                        </div>
                    </div>
                    <div class="absolute -right-4 -bottom-4 opacity-10 text-8xl"><i class="fa fa-futbol"></i></div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    // THE ENGINE LOGIC
    function executeOrder(type) {
        const amount = document.getElementById('trade-amount').value;
        const phone = "12148157474"; 
        const message = `ORDER_EXECUTION: ${type} | ASSET: USDT | AMOUNT: ${amount} | TOTAL_LYD: ${amount * 6.344}`;
        
        // This simulates the "Back-end" handshake
        console.log("Routing order through GT Vanguard Liquidity Provider...");
        
        // Redirect to WhatsApp Payment Gateway (The Real Flow)
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
    }

    // Initialize Charting Engine
    window.onload = () => {
        new TradingView.widget({
            "container_id": "tv_engine_container",
            "autosize": true,
            "symbol": "BINANCE:BTCUSDT",
            "interval": "5",
            "timezone": "Africa/Tripoli",
            "theme": "light",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "withdateranges": true,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "details": true,
            "hotlist": true,
            "calendar": true
        });
    };
</script>

</body>
</html>

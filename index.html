<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Trade</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:white;
  text-align:center;
}
.page{display:none;padding:20px;}
.active{display:block;}
h1{margin-top:40px;}
.btn{
  display:block;
  width:250px;
  margin:10px auto;
  padding:15px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  color:white;
  cursor:pointer;
}
input{
  padding:12px;
  margin:8px;
  width:200px;
  border-radius:8px;
  border:none;
}
.card{
  margin:20px;
  padding:20px;
  border-radius:14px;
  background:rgba(255,255,255,0.05);
}
</style>
</head>

<body onload="loadMarket()">

<!-- LOGIN -->
<div id="loginPage" class="page active">
<h1>Global Trade Login</h1>
<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>
<button class="btn" onclick="login()">Login</button>
<button class="btn" onclick="register()">Register</button>
</div>

<!-- HOME -->
<div id="homePage" class="page">
<h1>Global Trade</h1>
<div id="balanceBox"></div>

<button class="btn" onclick="showPage('stocks')">Stocks</button>
<button class="btn" onclick="showPage('crypto')">Crypto</button>
<button class="btn" onclick="showPage('gold')">Gold & Oil</button>
<button class="btn" onclick="showPage('learn')">Learn</button>
<button class="btn" onclick="showPage('send')">Send Money</button>
<button class="btn" onclick="logout()">Logout</button>
</div>

<!-- STOCKS -->
<div id="stocks" class="page">
<h1>Stocks Market</h1>
<div class="card">
<h2 id="aapl">AAPL Loading...</h2>
</div>
<div class="card">
<h2 id="tsla">TSLA Loading...</h2>
</div>
<button class="btn" onclick="showPage('homePage')">Back</button>
</div>

<!-- CRYPTO -->
<div id="crypto" class="page">
<h1>Crypto Market</h1>
<div class="card">
<h2 id="btc">BTC Loading...</h2>
</div>
<div class="card">
<h2 id="eth">ETH Loading...</h2>
</div>
<button class="btn" onclick="showPage('homePage')">Back</button>
</div>

<!-- GOLD & OIL -->
<div id="gold" class="page">
<h1>Gold & Oil</h1>
<div class="card">
<h2 id="goldPrice">Gold Loading...</h2>
</div>
<div class="card">
<h2 id="oilPrice">Oil Loading...</h2>
</div>
<button class="btn" onclick="showPage('homePage')">Back</button>
</div>

<!-- LEARN -->
<div id="learn" class="page">
<h1>Learn Trading</h1>
<video controls width="90%">
  <source src="trading.mp4">
</video>
<audio controls>
  <source src="trading-en.mp3">
</audio>
<audio controls>
  <source src="trading-ar.mp3">
</audio>
<button class="btn" onclick="showPage('homePage')">Back</button>
</div>

<!-- SEND MONEY -->
<div id="send" class="page">
<h1>Send Money Worldwide</h1>
<input id="amount" placeholder="Amount"><br>
<button class="btn" onclick="sendMoney()">Send</button>
<button class="btn" onclick="showPage('homePage')">Back</button>
</div>

<script>
// 🔥 FIREBASE CONFIG - REPLACE WITH YOURS
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let currentUser;

// PAGE SWITCH
function showPage(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(page).classList.add('active');
}

// REGISTER
function register(){
  let email = document.getElementById('email').value;
  let password = document.getElementById('password').value;
  auth.createUserWithEmailAndPassword(email,password)
    .then(user=>{
      db.collection("users").doc(user.user.uid).set({balance:1000});
      alert("Account Created");
    })
    .catch(err=>alert(err.message));
}

// LOGIN
function login(){
  let email = document.getElementById('email').value;
  let password = document.getElementById('password').value;
  auth.signInWithEmailAndPassword(email,password)
    .then(user=>{
      currentUser = user.user;
      loadBalance();
      showPage('homePage');
    })
    .catch(err=>alert(err.message));
}

// LOGOUT
function logout(){
  auth.signOut();
  showPage('loginPage');
}

// LOAD BALANCE
function loadBalance(){
  db.collection("users").doc(currentUser.uid).get()
    .then(doc=>{
      document.getElementById("balanceBox").innerHTML = "Balance: $" + doc.data().balance;
    });
}

// SEND MONEY
function sendMoney(){
  let amt = parseFloat(document.getElementById('amount').value);
  let ref = db.collection("users").doc(currentUser.uid);
  db.runTransaction(async (t)=>{
    let doc = await t.get(ref);
    let bal = doc.data().balance;
    if(bal >= amt){
      t.update(ref,{balance:bal - amt});
      alert("Sent!");
      loadBalance();
    }else{
      alert("Not enough balance");
    }
  });
}

// 🔥 LIVE MARKET DATA (TOKEN MODE)
const API_KEY = "YOUR_TOKEN"; // Finnhub or other API

async function getStock(symbol, elementId){
  let res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${API_KEY}`);
  let data = await res.json();
  document.getElementById(elementId).innerHTML = symbol + " : $" + data.c;
}

function loadMarket(){
  getStock("AAPL","aapl");
  getStock("TSLA","tsla");
  getStock("BINANCE:BTCUSDT","btc");
  getStock("BINANCE:ETHUSDT","eth");
  getStock("COMEX:GC1!","goldPrice");
  getStock("NYMEX:CL1!","oilPrice");
}

setInterval(loadMarket,5000);
</script>

</body>
</html>

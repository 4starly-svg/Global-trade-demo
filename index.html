<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Trade LTD</title>
<style>
body { margin:0; background:#121212; font-family: Arial, sans-serif; color:#fff; }
.centered { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.hidden { display:none; }
input, button { margin:10px; padding:10px; font-size:1rem; border-radius:8px; border:none; }
button { cursor:pointer; background-color:#0d6efd; color:#fff; transition:0.3s; }
button:hover { background-color:#0056b3; }
#ticker span { margin:0 10px; font-weight:bold; }
#slideshow img { border-radius:12px; box-shadow:0 0 20px #0d6efd; width:640px; height:360px; object-fit:cover; }
video { border-radius:12px; box-shadow:0 0 20px #0d6efd; cursor:pointer; }
</style>
</head>
<body>

<div id="loginPage" class="centered">
  <h1 id="loginTitle">Login</h1>
  <input id="username" placeholder="Username">
  <input id="password" placeholder="Password" type="password">
  <button id="guestLogin">Login as Guest</button>
  <button id="toggleLang">عربي / EN</button>
</div>

<div id="dashboard" class="hidden">
  <div id="ticker" class="centered">
    <span>Gold: $1985</span> | <span>Oil: $88</span> | <span>USD: 1.00</span> | <span>Stock A: $15</span> | <span>Stock B: $23</span>
  </div>

  <div id="videoContainer" class="centered">
    <video id="marketVideo" width="640" height="360" controls>
      <!-- Arabic trading video embedded via online link -->
      <source src="https://example.com/arabic-trading-video.mp4" type="video/mp4">
    </video>
  </div>

  <div id="slideshow" class="centered">
    <!-- Using previous AI-generated images online links -->
    <img id="slideImg" src="https://example.com/ai-image1.png" alt="Slide">
  </div>

  <div id="walletSection" class="centered">
    <h2>USDT Wallet</h2>
    <p id="walletAddr">No wallet created</p>
    <button id="createWalletBtn">Create Wallet</button>
    <input id="sendAddress" placeholder="Recipient Address">
    <input id="sendAmount" placeholder="Amount">
    <button id="sendUSDTBtn">Send USDT</button>
  </div>

  <button id="toggleLangDash">عربي / EN</button>
</div>

<script>
let currentUser = {};
let isArabic = false;

// Login
document.getElementById('guestLogin').addEventListener('click', ()=>{
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
});

// Toggle Arabic / English
document.getElementById('toggleLang').addEventListener('click', toggleLang);
document.getElementById('toggleLangDash').addEventListener('click', toggleLang);

function toggleLang(){
  isArabic=!isArabic;
  if(isArabic){
    document.getElementById('loginTitle').innerText="تسجيل الدخول";
    document.getElementById('username').placeholder="اسم المستخدم";
    document.getElementById('password').placeholder="كلمة المرور";
    document.getElementById('guestLogin').innerText="تسجيل كزائر";
    document.getElementById('walletSection').querySelector('h2').innerText="محفظة USDT";
    document.getElementById('createWalletBtn').innerText="إنشاء المحفظة";
    document.getElementById('sendUSDTBtn').innerText="أرسل USDT";
  }else{
    document.getElementById('loginTitle').innerText="Login";
    document.getElementById('username').placeholder="Username";
    document.getElementById('password').placeholder="Password";
    document.getElementById('guestLogin').innerText="Login as Guest";
    document.getElementById('walletSection').querySelector('h2').innerText="USDT Wallet";
    document.getElementById('createWalletBtn').innerText="Create Wallet";
    document.getElementById('sendUSDTBtn').innerText="Send USDT";
  }
}

// Slideshow
let slideIndex=0;
const slides=["https://example.com/ai-image1.png","https://example.com/ai-image2.png"];
setInterval(()=>{
  slideIndex=(slideIndex+1)%slides.length;
  document.getElementById('slideImg').src=slides[slideIndex];
},4000);

// USDT Wallet creation (mainnet placeholder)
document.getElementById('createWalletBtn').addEventListener('click', async ()=>{
  if(currentUser.usdtWallet) return alert('Wallet already created');
  alert('USDT mainnet wallet creation will be implemented here');
  currentUser.usdtWallet={address:"TWalletExample123456", privateKey:"PrivateKeyExample"};
  document.getElementById('walletAddr').innerText=currentUser.usdtWallet.address;
});

// Send USDT placeholder
document.getElementById('sendUSDTBtn').addEventListener('click', ()=>{
  const toAddr=document.getElementById('sendAddress').value;
  const amt=document.getElementById('sendAmount').value;
  if(!toAddr||!amt) return alert('Enter address and amount');
  if(!currentUser.usdtWallet) return alert('Wallet not created');
  alert(`Sending ${amt} USDT to ${toAddr} (simulation, will connect to mainnet)`);
});
</script>

</body>
</html>

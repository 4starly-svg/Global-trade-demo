<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Global Trade Capital</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = null;
let balance = 0;

// AUTH
window.register = async () => {
  await setDoc(doc(db,"users",emailR.value),{
    password: passR.value,
    balance:0,
    bets:[],
    transactions:[]
  });
  alert("Registered");
};

window.login = async () => {
  const ref = doc(db,"users",email.value);
  const snap = await getDoc(ref);

  if(!snap.exists()) return alert("User not found");

  const data = snap.data();
  if(data.password !== pass.value) return alert("Wrong password");

  currentUser = email.value;
  balance = data.balance;

  auth.style.display="none";
  appBox.style.display="block";
  updateBalance();
};

// BALANCE
function updateBalance(){
  bal.innerText = "Balance: " + balance.toFixed(2) + " USDT";
}

// WALLET
window.wallet = () => {
  content.innerHTML = `
  <div class="container">

    <div class="card">
      <h3>Deposit (USDT)</h3>
      <input id="addr" placeholder="Your Wallet Address">
      <input id="amt" placeholder="Amount">
      <button onclick="deposit()">Request Deposit</button>
    </div>

    <div class="card">
      <h3>Withdraw</h3>
      <input id="waddr" placeholder="Wallet Address">
      <input id="wamt" placeholder="Amount">
      <button onclick="withdraw()">Request Withdrawal</button>
    </div>

  </div>`;
};

window.deposit = async () => {
  await updateDoc(doc(db,"users",currentUser),{
    transactions: arrayUnion({
      type:"deposit",
      amount:amt.value,
      address:addr.value,
      status:"pending"
    })
  });
  alert("Deposit request sent");
};

window.withdraw = async () => {
  if(wamt.value > balance) return alert("Not enough");

  await updateDoc(doc(db,"users",currentUser),{
    transactions: arrayUnion({
      type:"withdraw",
      amount:wamt.value,
      address:waddr.value,
      status:"pending"
    })
  });

  alert("Withdraw request sent");
};

// MATCHES
window.loadMatches = () => {
  const matches = [
    ["Real Madrid","Barcelona"],
    ["Liverpool","Chelsea"]
  ];

  content.innerHTML = `<div class="container">`;

  matches.forEach(m=>{
    let odds = (Math.random()*1.5+1.5).toFixed(2);

    content.innerHTML += `
    <div class="card">
      ${m[0]} vs ${m[1]}
      <button onclick="bet('${m[0]}',${odds})">${m[0]} (${odds}x)</button>
    </div>`;
  });

  content.innerHTML += `</div>`;
};

// BET
window.bet = async (team, odds) => {

  let amount = 5;

  if(balance < amount) return alert("No balance");

  balance -= amount;

  await updateDoc(doc(db,"users",currentUser),{
    balance,
    bets: arrayUnion({
      team,
      odds,
      amount,
      status:"pending",
      date:new Date().toLocaleString()
    })
  });

  updateBalance();
  alert("Bet placed");
};

</script>

<style>
body { background:#0b0b0b; color:#fff; font-family:Arial; text-align:center; }
.logo { font-size:28px; color:#00ffcc; margin:20px; }
.container { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; }
.card { background:#1a1a1a; padding:20px; width:260px; border-radius:10px; }
button { width:100%; padding:10px; margin-top:10px; background:#00ffcc; border:none; }
input { width:90%; padding:8px; margin-top:5px; }
</style>

</head>

<body>

<div class="logo">GLOBAL TRADE CAPITAL</div>

<div id="auth">
<div class="container">

<div class="card">
<h3>Login</h3>
<input id="email">
<input id="pass" type="password">
<button onclick="login()">Login</button>
</div>

<div class="card">
<h3>Register</h3>
<input id="emailR">
<input id="passR" type="password">
<button onclick="register()">Register</button>
</div>

</div>
</div>

<div id="appBox" style="display:none;">

<h3 id="bal"></h3>

<div class="container">
<div class="card" onclick="loadMatches()">⚽ Soccer</div>
<div class="card" onclick="wallet()">💰 Wallet</div>
</div>

<div id="content"></div>

</div>

</body>
</html>

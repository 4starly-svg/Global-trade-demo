<!DOCTYPE html>
<html lang="ar" dir="rtl" id="main-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GT LTD | AI TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --mint: #00ffcc; --bg: #030712; --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; font-family: 'Inter', 'Noto Sans Arabic', sans-serif; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        body, html { height: 100%; margin: 0; background: var(--bg); color: #e5e7eb; overflow: hidden; }

        /* 🌌 BACKGROUND EFFECT */
        body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(circle at 10% 20%, rgba(0, 255, 204, 0.05) 0%, transparent 50%); z-index: -1; }

        /* 🔐 AI LOGIN GATE */
        #auth-gate { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .auth-card { width: 420px; padding: 50px; background: var(--glass); border: 1px solid var(--border); border-radius: 24px; text-align: center; }
        .auth-card h1 { font-size: 24px; font-weight: 900; letter-spacing: 2px; margin-bottom: 30px; color: #fff; }
        
        .ai-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 16px; color: #fff; border-radius: 12px; margin-bottom: 15px; text-align: center; outline: none; }
        .ai-input:focus { border-color: var(--mint); box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); }
        
        .btn-main { width: 100%; padding: 16px; background: var(--mint); color: #000; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; }
        .btn-guest { width: 100%; padding: 14px; background: transparent; color: var(--mint); border: 1px solid var(--mint); border-radius: 12px; font-weight: 700; cursor: pointer; }

        /* 📊 DASHBOARD */
        #terminal { display: none; height: 100vh; flex-direction: column; }
        header { height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; border-bottom: 1px solid var(--border); }
        .nav-links { display: flex; gap: 30px; }
        .nav-item { font-size: 13px; font-weight: 700; color: #9ca3af; cursor: pointer; letter-spacing: 1px; }
        .nav-item.active { color: var(--mint); }

        /* 🖥️ VIEWPORT */
        main { flex: 1; padding: 30px; display: flex; gap: 20px; }
        .panel { flex: 1; background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 40px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        
        .label { font-size: 11px; font-weight: 900; color: var(--mint); text-transform: uppercase; letter-spacing: 2px; }
        .balance { font-size: 64px; font-weight: 900; margin: 15px 0; color: #fff; }
        
        .btn-action { padding: 14px 28px; background: var(--mint); color: #000; border-radius: 10px; border: none; font-weight: 900; width: fit-content; cursor: pointer; margin-top: 20px; }

        /* 🌍 LANG TOGGLE */
        .lang-toggle { background: var(--glass); border: 1px solid var(--border); color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 11px; }

        /* 🛡️ TRUST BAR */
        .trust-bar { margin-top: 40px; display: flex; gap: 25px; opacity: 0.4; filter: invert(1); }
        .trust-bar img { height: 18px; }

        iframe { width: 100%; height: 100%; border-radius: 20px; border: 1px solid var(--border); }
    </style>
</head>
<body>

    <div id="auth-gate">
        <div class="auth-card">
            <h1 id="t-welcome">GLOBAL TRADE AI</h1>
            <input type="password" id="key" class="ai-input" placeholder="PRIVATE KEY / المفتاح">
            <button class="btn-main" onclick="login()">AUTHORIZE</button>
            <button class="btn-guest" onclick="guest()">GUEST ACCESS</button>
            <div style="margin-top: 25px;">
                <button class="lang-toggle" onclick="setLang('en')">EN</button>
                <button class="lang-toggle" onclick="setLang('ar')">AR</button>
            </div>
        </div>
    </div>

    <div id="terminal">
        <header>
            <div style="font-weight: 900; letter-spacing: 2px; color: var(--mint);">GT LTD // AI</div>
            <div class="nav-links">
                <div class="nav-item active" onclick="tab('v-home', this)" id="m1">PORTFOLIO</div>
                <div class="nav-item" onclick="tab('v-trade', this)" id="m2">EXECUTION</div>
                <div class="nav-item" onclick="tab('v-hq', this)" id="m3">BRIEFING</div>
            </div>
            <button class="lang-toggle" onclick="setLang(document.dir === 'rtl' ? 'en' : 'ar')">⚙️ TOGGLE LANG</button>
        </header>

        <main>
            <div id="v-home" class="panel" style="display: flex; flex-direction: row; width: 100%; gap: 30px;">
                <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                    <div class="label" id="l-bal">TOTAL EQUITY</div>
                    <div class="balance" id="val-bal">$0.00</div>
                    <div style="color: var(--mint); font-size: 12px; font-weight: 700;" id="l-status">● NEURAL DATA SYNC ACTIVE</div>
                    <button class="btn-action" onclick="window.location.href='https://wa.me/218915709015'" id="l-btn">TRANSFER FUNDS</button>
                    
                    <div class="trust-bar">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg">
                    </div>
                </div>
                <div style="flex: 1.5;">
                    <iframe src="https://www.tradingview.com/widgetembed/?symbol=NASDAQ:TSLA&theme=dark"></iframe>
                </div>
            </div>

            <div id="v-trade" class="panel" style="display: none; flex-direction: row; width: 100%; gap: 30px;">
                <div style="flex: 1.5;">
                    <iframe src="https://www.tradingview.com/widgetembed/?symbol=BITSTAMP:BTCUSD&theme=dark"></iframe>
                </div>
                <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                    <div class="label">TRADE EXECUTION</div>
                    <input type="text" id="t-sym" class="ai-input" placeholder="Asset Symbol">
                    <input type="number" id="t-amt" class="ai-input" placeholder="Amount (USD)">
                    <button class="btn-main" onclick="exec('BUY')">BUY</button>
                    <button class="btn-main" style="background:#ff4d4d;" onclick="exec('SELL')">SELL</button>
                </div>
            </div>

            <div id="v-hq" class="panel" style="display: none; width: 100%; text-align: center;">
                <div class="label">AI VOICE REPORT</div>
                <button class="btn-action" style="margin: 30px auto;" onclick="speak()">GENERATE BRIEFING 🎙️</button>
                <div class="label" style="margin-top: 40px;">DIRECT SUPPORT</div>
                <h2 style="font-size: 32px; font-weight: 900;">+218 91 570 9015</h2>
                <button class="btn-guest" style="width: 200px; margin: 0 auto;" onclick="window.location.href='https://wa.me/218915709015'">WHATSAPP AI</button>
            </div>
        </main>
    </div>

<script>
    const database = {
        "GT-VIP": { name: "EXECUTIVE CLIENT", bal: "$500,000.00" },
        "GUEST": { name: "VISITOR", bal: "$10,000.00" }
    };

    function setLang(l) {
        const h = document.getElementById('main-html');
        h.dir = (l === 'ar') ? 'rtl' : 'ltr';
        h.lang = l;
        
        // Dynamic translation
        document.getElementById('m1').innerText = (l === 'ar') ? 'المحفظة' : 'PORTFOLIO';
        document.getElementById('m2').innerText = (l === 'ar') ? 'التنفيذ' : 'EXECUTION';
        document.getElementById('m3').innerText = (l === 'ar') ? 'التقرير' : 'BRIEFING';
        document.getElementById('l-bal').innerText = (l === 'ar') ? 'إجمالي الأصول' : 'TOTAL EQUITY';
        document.getElementById('l-btn').innerText = (l === 'ar') ? 'تحويل الأموال' : 'TRANSFER FUNDS';
    }

    function login() {
        const k = document.getElementById('key').value;
        if(database[k]) render(database[k]);
        else alert("ACCESS DENIED");
    }

    function guest() { render(database["GUEST"]); }

    function render(user) {
        document.getElementById('auth-gate').style.display = 'none';
        document.getElementById('terminal').style.display = 'flex';
        document.getElementById('val-bal').innerText = user.bal;
    }

    function tab(id, el) {
        document.getElementById('v-home').style.display = 'none';
        document.getElementById('v-trade').style.display = 'none';
        document.getElementById('v-hq').style.display = 'none';
        document.getElementById(id).style.display = 'flex';
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }

    function exec(type) {
        const s = document.getElementById('t-sym').value;
        const a = document.getElementById('t-amt').value;
        window.location.href = `https://wa.me/218915709015?text=AI_ORDER_${type}_${a}_${s}`;
    }

    function speak() {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(document.dir === 'rtl' ? "مرحباً بك في نظام التداول الذكي الخاص بجلوبال تريد. سيولة حسابك مؤمنة بالكامل وجاهزة للتنفيذ." : "Welcome to Global Trade AI system. Your liquidity is fully secured and ready for execution.");
        msg.lang = (document.dir === 'rtl') ? 'ar-SA' : 'en-US';
        window.speechSynthesis.speak(msg);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Trade LY | Pro Terminal 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --sidebar-w: 280px; --brand-blue: #1e40af; }
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .sidebar { width: var(--sidebar-w); background: white; height: 100vh; position: fixed; border-right: 1px solid #e2e8f0; }
        .main-view { margin-left: var(--sidebar-w); width: calc(100% - var(--sidebar-w)); min-height: 100vh; }
        .stat-card { background: white; border-radius: 16px; padding: 24px; border: 1px solid #e2e8f0; transition: 0.3s; }
        .active-nav { background: #eff6ff; color: var(--brand-blue); border-right: 4px solid var(--brand-blue); font-weight: 700; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="flex">

<aside class="sidebar flex flex-col">
    <div class="p-8"><h1 class="text-2xl font-black text-blue-800 tracking-tighter">GLOBAL TRADE <span class="text-amber-500">LY</span></h1></div>
    <nav class="flex-1 space-y-1">
        <div class="active-nav flex items-center gap-4 px-8 py-4 cursor-pointer">
            <i class="fa-solid fa-chart-line"></i> <span>Dashboard</span>
        </div>
        <div onclick="openWhatsApp('Bank')" class="flex items-center gap-4 px-8 py-4 text-slate-500 hover:bg-slate-50 cursor-pointer transition">
            <i class="fa-solid fa-vault"></i> <span>Bank Deposits</span>
        </div>
        <div class="flex items-center gap-4 px-8 py-4 text-slate-500 hover:bg-slate-50 cursor-pointer">
            <i class="fa-solid fa-futbol"></i> <span>Soccer Intelligence</span>
        </div>
    </nav>
    <div class="p-8 border-t"><button onclick="toggleLang()" class="text-sm font-bold text-slate-400 uppercase tracking-widest">EN / العربية</button></div>
</aside>

<main class="main-view p-8">
    <header class="flex justify-between items-center mb-10">
        <div>
            <h2 class="text-3xl font-black text-slate-900">Institutional Terminal</h2>
            <p class="text-slate-400 font-medium uppercase text-xs tracking-widest mt-1">Status: <span class="text-green-500">Connected</span></p>
        </div>
        <div class="flex gap-4">
            <div class="bg-white px-6 py-3 rounded-2xl border border-slate-200 flex flex-col justify-center">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">USDT / LYD</span>
                <span class="text-lg font-black text-blue-600 leading-none">6.3440</span>
            </div>
            <button onclick="openWhatsApp('Live Support')" class="bg-green-500 text-white px-8 py-4 rounded-2xl font-bold shadow-lg shadow-green-100 hover:bg-green-600 transition">Support</button>
        </div>
    </header>

    <div class="grid grid-cols-12 gap-6">
        <div class="col-span-12 lg:col-span-8">
            <div class="stat-card h-[600px] flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-bold text-slate-800 uppercase text-xs tracking-widest">Market Intelligence</span>
                    <span class="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded font-bold uppercase">Real-Time</span>
                </div>
                <div id="tradingview_container" class="flex-1"></div>
            </div>
        </div>

        <div class="col-span-12 lg:col-span-4 space-y-6">
            <div class="stat-card">
                <h3 class="font-bold text-slate-800 mb-6 uppercase text-xs tracking-widest">Execution Engine</h3>
                <div class="space-y-4">
                    <div class="relative">
                        <label class="text-[10px] font-black text-slate-400 uppercase absolute left-4 top-2">Amount USDT</label>
                        <input type="number" id="trade-amt" value="1000" oninput="calculate()" class="w-full pt-7 pb-3 px-4 bg-slate-50 border border-slate-100 rounded-xl font-bold text-xl outline-none focus:border-blue-500 transition">
                    </div>
                    <div class="p-4 bg-blue-50 rounded-xl flex justify-between items-center border border-blue-100">
                        <span class="text-blue-800 text-sm font-bold">Total LYD</span>
                        <span class="text-2xl font-black text-blue-900" id="lyd-total">6,344.00</span>
                    </div>
                    <button onclick="executeTrade('BUY')" class="w-full py-5 bg-blue-600 text-white font-black rounded-2xl hover:bg-blue-700 shadow-xl shadow-blue-100 transition-all uppercase tracking-widest text-sm">Execute Buy</button>
                </div>
            </div>

            <div class="stat-card bg-slate-900 text-white border-none shadow-2xl relative overflow-hidden">
                <div class="relative z-10">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-[10px] font-black uppercase tracking-widest opacity-60">Live Soccer AI</span>
                        <span id="match-status" class="bg-red-600 text-white text-[9px] px-2 py-1 rounded font-black animate-pulse uppercase">LIVE</span>
                    </div>
                    <p id="match-name" class="font-bold text-lg mb-4 text-center">Scanning for matches...</p>
                    <div class="flex justify-between items-center bg-white/5 rounded-2xl py-6 px-4">
                        <div class="text-center w-1/3">
                            <span id="home-score" class="text-4xl font-black text-amber-400">0</span>
                            <p class="text-[9px] uppercase font-bold opacity-40 mt-1">Home</p>
                        </div>
                        <div class="text-sm font-black opacity-20 italic">VS</div>
                        <div class="text-center w-1/3">
                            <span id="away-score" class="text-4xl font-black text-white">0</span>
                            <p class="text-[9px] uppercase font-bold opacity-40 mt-1">Away</p>
                        </div>
                    </div>
                    <button onclick="openWhatsApp('Match Analysis')" class="w-full mt-6 py-4 bg-white/10 hover:bg-white/20 rounded-xl font-bold transition text-xs uppercase tracking-widest border border-white/10">Request AI Tips</button>
                </div>
                <div class="absolute -right-6 -bottom-6 text-9xl opacity-5"><i class="fa fa-futbol"></i></div>
            </div>
        </div>
    </div>
</main>

<script>
    const CONFIG = {
        rate: 6.3440,
        phone: "12148157474",
        // FOR PRODUCTION: Get a key at api-football.com
        apiKey: "YOUR_API_KEY_HERE" 
    };

    // 1. CALCULATION ENGINE
    function calculate() {
        const amt = document.getElementById('trade-amt').value;
        const total = (amt * CONFIG.rate).toLocaleString(undefined, { minimumFractionDigits: 2 });
        document.getElementById('lyd-total').innerText = total;
    }

    // 2. WHATSAPP GATEWAY
    function openWhatsApp(topic) {
        window.open(`https://wa.me/${CONFIG.phone}?text=GlobalTradeLY: ${topic}`, '_blank');
    }

    function executeTrade(side) {
        const amt = document.getElementById('trade-amt').value;
        const total = (amt * CONFIG.rate).toLocaleString();
        const msg = `🚀 ORDER: ${side}\n💰 ASSET: USDT\n📊 AMOUNT: ${amt}\n💵 TOTAL: ${total} LYD`;
        window.open(`https://wa.me/${CONFIG.phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // 3. LIVE SOCCER ENGINE (WITH FALLBACK)
    async function syncSoccer() {
        try {
            const res = await fetch("https://v3.football.api-sports.io/fixtures?live=all", {
                "method": "GET",
                "headers": {
                    "x-rapidapi-host": "v3.football.api-sports.io",
                    "x-rapidapi-key": CONFIG.apiKey
                }
            });
            const data = await res.json();
            
            if (data.response && data.response.length > 0) {
                const match = data.response[0]; // Take top live match
                document.getElementById('match-name').innerText = `${match.teams.home.name} vs ${match.teams.away.name}`;
                document.getElementById('home-score').innerText = match.goals.home;
                document.getElementById('away-score').innerText = match.goals.away;
                document.getElementById('match-status').innerText = match.fixture.status.elapsed + "'";
            } else {
                // Fallback if no matches are live
                document.getElementById('match-name').innerText = "No Matches In-Play";
                document.getElementById('match-status').innerText = "Standby";
            }
        } catch (e) {
            console.log("Soccer Engine Syncing...");
            // Silent fallback for testing
            document.getElementById('match-name').innerText = "Syncing match data...";
        }
    }

    // 4. CHART ENGINE (TRADINGVIEW)
    window.onload = () => {
        new TradingView.widget({
            "container_id": "tradingview_container",
            "autosize": true,
            "symbol": "BINANCE:BTCUSDT",
            "interval": "D",
            "timezone": "Africa/Tripoli",
            "theme": "light",
            "style": "1",
            "locale": "en",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "details": true,
            "hotlist": true,
            "calendar": true
        });
        
        calculate();
        syncSoccer();
        setInterval(syncSoccer, 60000); // Sync every minute
    };
</script>
</body>
</html>

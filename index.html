<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Trade LTD</title>
<style>
body { margin:0; background:#0b0c10; font-family: Arial, sans-serif; color:#fff; }
.centered { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.hidden { display:none; }
input, button { margin:10px; padding:12px 15px; font-size:1rem; border-radius:8px; border:none; }
button { cursor:pointer; background-color:#1f2833; color:#66fcf1; font-weight:bold; transition:0.3s; }
button:hover { background-color:#45a29e; color:#0b0c10; }
#ticker { display:flex; justify-content:center; margin:20px 0; font-weight:bold; }
#ticker span { margin:0 15px; }
.section-container { display:flex; justify-content:center; flex-wrap:wrap; margin:20px; gap:20px; }
.section-box { background:#1f2833; padding:20px; border-radius:12px; width:220px; height:180px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:0.3s; }
.section-box:hover { background:#45a29e; color:#0b0c10; }
#slideshow img { border-radius:12px; width:200px; height:120px; object-fit:cover; box-shadow:0 0 15px #66fcf1; }
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="centered">
  <h1 id="loginTitle">Login</h1>
  <input id="username" placeholder="Username">
  <input id="password" placeholder="Password" type="password">
  <button id="guestLogin">Login as Guest</button>
  <button id="toggleLang">عربي / EN</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
  <!-- Ticker -->
  <div id="ticker">
    <span id="tickerGold">Gold: $1985</span>
    <span id="tickerOil">Oil: $88</span>
    <span id="tickerUSD">USD: 1.00</span>
    <span id="tickerStockA">AAPL: $0</span>
    <span id="tickerStockB">MSFT: $0</span>
  </div>

  <!-- Sections Side-by-Side -->
  <div class="section-container">
    <div class="section-box" id="stocksBox">Stocks</div>
    <div class="section-box" id="cryptoBox">Crypto</div>
    <div class="section-box" onclick="alert('Learn to Trade section')">Learn to Trade</div>
    <div class="section-box" onclick="alert('Epics section')">Epics</div>
    <div class="section-box">
      Gold / Oil
      <div id="slideshow">
        <img src="https://example.com/ai-image1.png" alt="Slide">
      </div>
    </div>
    <div class="section-box" onclick="alert('Contact Us section')">Contact Us</div>
  </div>

  <!-- USDT Wallet -->
  <div class="centered">
    <h2>USDT Wallet</h2>
    <p id="walletAddr">No wallet created</p>
    <button id="createWalletBtn">Create Wallet</button>
    <input id="sendAddress" placeholder="Recipient Address">
    <input id="sendAmount" placeholder="Amount">
    <button id="sendUSDTBtn">Send USDT</button>
  </div>

  <button id="toggleLangDash">عربي / EN</button>
</div>

<script>
// LOGIN & DASHBOARD
let currentUser = {};
let isArabic = false;

document.getElementById('guestLogin').addEventListener('click', ()=>{
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  updateCrypto();
  updateStocks();
});

document.getElementById('toggleLang').addEventListener('click', toggleLang);
document.getElementById('toggleLangDash').addEventListener('click', toggleLang);

function toggleLang(){
  isArabic=!isArabic;
  if(isArabic){
    document.getElementById('loginTitle').innerText="تسجيل الدخول";
    document.getElementById('username').placeholder="اسم المستخدم";
    document.getElementById('password').placeholder="كلمة المرور";
    document.getElementById('guestLogin').innerText="تسجيل كزائر";
    document.getElementById('createWalletBtn').innerText="إنشاء المحفظة";
    document.getElementById('sendUSDTBtn').innerText="أرسل USDT";
    document.getElementById('stocksBox').innerText="الأسهم";
    document.getElementById('cryptoBox').innerText="العملات الرقمية";
  }else{
    document.getElementById('loginTitle').innerText="Login";
    document.getElementById('username').placeholder="Username";
    document.getElementById('password').placeholder="Password";
    document.getElementById('guestLogin').innerText="Login as Guest";
    document.getElementById('createWalletBtn').innerText="Create Wallet";
    document.getElementById('sendUSDTBtn').innerText="Send USDT";
    document.getElementById('stocksBox').innerText="Stocks";
    document.getElementById('cryptoBox').innerText="Crypto";
  }
}

// Slideshow
let slideIndex=0;
const slides=["https://example.com/ai-image1.png","https://example.com/ai-image2.png"];
setInterval(()=>{
  slideIndex=(slideIndex+1)%slides.length;
  document.querySelector("#slideshow img").src=slides[slideIndex];
},4000);

// USDT Wallet
document.getElementById('createWalletBtn').addEventListener('click', ()=>{
  if(currentUser.usdtWallet) return alert('Wallet already created');
  currentUser.usdtWallet={address:"TWalletExample123456", privateKey:"PrivateKeyExample"};
  document.getElementById('walletAddr').innerText=currentUser.usdtWallet.address;
  alert('USDT Wallet created');
});

document.getElementById('sendUSDTBtn').addEventListener('click', ()=>{
  const toAddr=document.getElementById('sendAddress').value;
  const amt=document.getElementById('sendAmount').value;
  if(!toAddr||!amt) return alert('Enter address and amount');
  if(!currentUser.usdtWallet) return alert('Wallet not created');
  alert(`Sending ${amt} USDT to ${toAddr} (simulation)`);
});

// Crypto Integration - CoinGecko
async function updateCrypto(){
  try{
    const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd');
    const data = await res.json();
    document.getElementById('cryptoBox').innerHTML = `Crypto
      <p>BTC: $${data.bitcoin.usd}</p>
      <p>ETH: $${data.ethereum.usd}</p>`;
  }catch(e){console.error(e);}
}
setInterval(updateCrypto,10000); // every 10 seconds

// Stocks Integration - Finnhub free demo API (replace with your key)
async function updateStocks(){
  try{
    const res = await fetch('https://finnhub.io/api/v1/quote?symbol=AAPL&token=YOUR_API_KEY');
    const aapl = await res.json();
    const res2 = await fetch('https://finnhub.io/api/v1/quote?symbol=MSFT&token=YOUR_API_KEY');
    const msft = await res2.json();
    document.getElementById('stocksBox').innerHTML = `Stocks
      <p>AAPL: $${aapl.c}</p>
      <p>MSFT: $${msft.c}</p>`;
    document.getElementById('tickerStockA').innerText=`AAPL: $${aapl.c}`;
    document.getElementById('tickerStockB').innerText=`MSFT: $${msft.c}`;
  }catch(e){console.error(e);}
}
setInterval(updateStocks,10000); // every 10 seconds

// Ticker placeholder Gold/Oil/USD dynamic update example
setInterval(()=>{
  const gold = (1980 + Math.random()*10).toFixed(2);
  const oil = (88 + Math.random()*2).toFixed(2);
  document.getElementById('tickerGold').innerText=`Gold: $${gold}`;
  document.getElementById('tickerOil').innerText=`Oil: $${oil}`;
},5000);

</script>
</body>
</html>

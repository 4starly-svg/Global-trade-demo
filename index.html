<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Trade Capital Dashboard</title>
<style>
body {margin:0; font-family:'Segoe UI',sans-serif; background:#121212; color:#e0e0e0; display:flex; flex-direction:column; align-items:center;}
h1,h2,h3,p {margin:0;}
button {cursor:pointer; border:none; border-radius:12px; padding:14px 22px; font-weight:bold; transition:0.3s;}
a {color:inherit; text-decoration:none;}
.flex {display:flex; gap:20px; flex-wrap:wrap;}
.center {justify-content:center; align-items:center;}
#loginPage {width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; background:#0a0a0a;}
#loginBox {background:#1c1c1c; padding:50px; border-radius:25px; display:flex; flex-direction:column; align-items:center; gap:20px; width:380px;}
#loginBox input {width:100%; padding:16px; border-radius:12px; border:none; background:#2e2e2e; color:white;}
#loginBox button {width:100%; background:#ff6f61; color:white; font-size:16px;}
#loginBox button:hover {background:#ff8f7f;}
header {display:none; width:100%; background:#1a1a1a; padding:20px 40px; display:flex; justify-content:space-between; align-items:center; color:#ffd700;}
header h1 {font-size:30px;}
header .lang-toggle, header .back-dashboard {background:#ffd700; color:#1a1a1a; padding:10px 18px; border-radius:10px; transition:0.2s;}
header .lang-toggle:hover, header .back-dashboard:hover {background:#ffe066;}
main {display:none; flex-wrap:wrap; justify-content:center; padding:30px; gap:25px;}
.card {background:#222; border-radius:20px; width:220px; height:130px; display:flex; flex-direction:column; justify-content:center; align-items:center; font-weight:bold; font-size:19px; transition:0.3s;}
.card:hover {background:#333; transform:scale(1.06);}
#sectionContent {display:none; width:95%; max-width:1280px; margin:20px auto;}
.section-card {background:#222; border-radius:20px; padding:25px; margin:12px 0;}
.section-card h3 {margin-bottom:12px;}
.section-data div {margin-bottom:10px; font-size:17px;}
.payments button {margin:6px; background:#ff6f61; color:white;}
.payments button:hover {background:#ff8f7f;}
</style>
</head>
<body><div id="loginPage">
  <div id="loginBox">
    <h2 id="loginTitle">Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="guestLogin()">Enter as Guest</button>
    <button class="lang-toggle-login" onclick="toggleLanguage()">عربي</button>
  </div>
</div><header>
  <h1>Global Trade Capital</h1>
  <div>
    <span class="lang-toggle" onclick="toggleLanguage()">عربي</span>
    <span class="back-dashboard" onclick="backToDashboard()">Back to Dashboard</span>
  </div>
</header><main>
  <div class="card" onclick="loadSection('stocks')">Stocks</div>
  <div class="card" onclick="loadSection('crypto')">Crypto</div>
  <div class="card" onclick="loadSection('fx')">FX</div>
  <div class="card" onclick="loadSection('commodities')">Commodities</div>
  <div class="card" onclick="loadSection('soccer')">Soccer Predictions</div>
  <div class="card" onclick="loadSection('learn')">Learn / Contact Us</div>
  <div class="card" onclick="loadSection('payments')">Payments</div>
</main><div id="sectionContent">
  <div id="stocksSection" class="section-card"></div>
  <div id="cryptoSection" class="section-card"></div>
  <div id="fxSection" class="section-card"></div>
  <div id="commoditiesSection" class="section-card"></div>
  <div id="soccerSection" class="section-card"></div>
  <div id="learnSection" class="section-card"></div>
  <div id="paymentsSection" class="section-card payments"></div>
</div><script>
let isArabic=false;
function login(){ startApp(); }
function guestLogin(){ startApp(); }
function startApp(){
  document.getElementById('loginPage').style.display='none';
  document.querySelector('header').style.display='flex';
  document.querySelector('main').style.display='flex';
  loadAllSections();
}

function toggleLanguage(){
  isArabic=!isArabic;
  document.body.dir=isArabic?'rtl':'ltr';
  document.querySelectorAll('.lang-toggle, .lang-toggle-login').forEach(el=>el.innerText=isArabic?'EN':'عربي');
  document.querySelectorAll('main .card').forEach((card,i)=>{
    const texts=[['Stocks','Crypto','FX','Commodities','Soccer Predictions','Learn / Contact Us','Payments'],['الأسهم','العملات الرقمية','العملات الأجنبية','السلع','توقعات كرة القدم','تعلم / اتصل بنا','المدفوعات']];
    card.innerText=isArabic?texts[1][i]:texts[0][i];
  });
  document.getElementById('loginTitle').innerText=isArabic?'تسجيل الدخول':'Login';
}

function backToDashboard(){
  document.getElementById('sectionContent').querySelectorAll('.section-card').forEach(sec=>sec.style.display='none');
  document.querySelector('main').style.display='flex';
}
function loadSection(name){
  document.querySelector('main').style.display='none';
  document.getElementById('sectionContent').querySelectorAll('.section-card').forEach(sec=>sec.style.display='none');
  document.getElementById(name+'Section').style.display='block';
}

async function loadAllSections(){
  const FINNHUB_KEY='7815da7ac2ab43ca8f4a4b73e10e';
  const stocks = ["AAPL","MSFT","XOM","CVX","JPM","GS"];
  let stockHTML='';
  stocks.forEach(s=>{ stockHTML+=`<div id="stock-${s}">${s} Loading...</div>`; });
  document.getElementById('stocksSection').innerHTML=`<h3>Stocks</h3><div class="section-data">${stockHTML}</div>`;
  stocks.forEach(async sym=>{
    const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${FINNHUB_KEY}`);
    const data = await res.json();
    document.getElementById(`stock-${sym}`).innerText=`${sym} ${data.c.toFixed(2)}`;
  });

  const cryptoRes = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,binancecoin,cardano&vs_currencies=usd');
  const cryptoData = await cryptoRes.json();
  document.getElementById('cryptoSection').innerHTML=`<h3>Crypto</h3><div class="section-data"><div>BTC ${cryptoData.bitcoin.usd}</div><div>ETH ${cryptoData.ethereum.usd}</div><div>BNB ${cryptoData.binancecoin.usd}</div><div>ADA ${cryptoData.cardano.usd}</div></div>`;

  try {
    const fxRes = await fetch('https://open.er-api.com/v6/latest/USD');
    const fxData = await fxRes.json();
    document.getElementById('fxSection').innerHTML=`<h3>FX Rates</h3><div class="section-data"><div>USD/LYD ${fxData.rates.LYD} 🇱🇾</div><div>EUR/LYD ${(fxData.rates.EUR/fxData.rates.USD*fxData.rates.LYD).toFixed(2)} 🇪🇺</div><div>GBP/LYD ${(fxData.rates.GBP/fxData.rates.USD*fxData.rates.LYD).toFixed(2)} 🇬🇧</div></div>`;
  } catch(e){console.log('FX API error',e);}

  document.getElementById('commoditiesSection').innerHTML='<h3>Commodities</h3><div class="section-data"><div>Libyan Oil 74 USD 🇴🇱</div><div>WTI 80 USD</div><div>Gold 1,950 USD</div></div>';

  document.getElementById('soccerSection').innerHTML='<h3>Soccer Predictions</h3><div class="section-data"><div>Team A 🆚 Team B <img src="https://via.placeholder.com/40"></div><div>Team C 🆚 Team D <img src="https://via.placeholder.com/40"></div><p>For info contact: 91-494-8944</p></div>';

  document.getElementById('learnSection').innerHTML='<h3>Learn / Contact Us</h3><p>Global Trade Capital helps you trade stocks, crypto, FX, and commodities. Send money worldwide with USDT, PayPal, CashAgent.</p><p>Libyan banks logos here...</p><audio controls><source src="audio_placeholder.mp3" type="audio/mpeg"></audio>';

  document.getElementById('paymentsSection').innerHTML='<h3>Payments</h3><button>USDT</button><button>PayPal</button><button>CashAgent</button>';
}
</script></body>
</html>

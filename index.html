<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Trade Pro</title>

<style>
body {margin:0;font-family:Arial;background:#0b0f14;color:#fff;}
.hidden{display:none;}
.center{display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:20px;}
.card{background:#121821;padding:20px;border-radius:10px;text-align:center;border:1px solid #1f2a36;}
.card:hover{border-color:#d4af37;}
button{background:#d4af37;border:none;padding:10px;margin:5px;border-radius:5px;cursor:pointer;}
.topbar{padding:15px;border-bottom:1px solid #222;text-align:center;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="center">
<h1>Global Trade</h1>
<button onclick="enter()">Enter Platform</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
<div class="topbar">Dashboard</div>
<div class="grid">
<div class="card" onclick="openPage('stocks')">Stocks</div>
<div class="card" onclick="openPage('crypto')">Crypto</div>
<div class="card" onclick="openPage('wallet')">Wallet</div>
<div class="card" onclick="openPage('profile')">Profile</div>
<div class="card" onclick="openPage('admin')">Admin</div>
</div>
</div>

<!-- STOCKS -->
<div id="stocks" class="hidden">
<div class="topbar"><button onclick="back()">⬅</button>Stocks</div>
<div id="stocksList" class="grid"></div>
</div>

<!-- CRYPTO -->
<div id="crypto" class="hidden">
<div class="topbar"><button onclick="back()">⬅</button>Crypto</div>
<div id="cryptoList" class="grid"></div>
</div>

<!-- WALLET -->
<div id="wallet" class="hidden">
<div class="topbar"><button onclick="back()">⬅</button>Wallet</div>
<div class="card">
<h3>Balance: $<span id="balance"></span></h3>
</div>
<div class="card">
<p>Deposit USDT / USD</p>
<h4 id="address"></h4>
<button onclick="createDeposit()">I Sent Funds</button>
<button onclick="requestWithdraw()">Withdraw</button>
</div>
</div>

<!-- PROFILE -->
<div id="profile" class="hidden">
<div class="topbar"><button onclick="back()">⬅</button>Profile</div>
<div class="card">
<h3>Your Portfolio</h3>
<div id="portfolio"></div>
</div>
</div>

<!-- ADMIN -->
<div id="admin" class="hidden">
<div class="topbar"><button onclick="back()">⬅</button>Admin Panel</div>
<div class="card">
<h3>Pending Deposits</h3>
<div id="deposits"></div>
</div>
</div>

<script>
// ===== DATA =====
let balance = parseFloat(localStorage.getItem("balance")) || 10000;
let portfolio = JSON.parse(localStorage.getItem("portfolio")||"{}");
let deposits = JSON.parse(localStorage.getItem("deposits")||"[]");

const walletAddress = "T" + Math.random().toString(36).substring(2,12).toUpperCase();
const API_KEY = "7815da7ac2ab43ca8f4a4b73e10e";

// ===== SAVE STATE =====
function save(){
localStorage.setItem("balance",balance);
localStorage.setItem("portfolio",JSON.stringify(portfolio));
localStorage.setItem("deposits",JSON.stringify(deposits));
}

// ===== NAVIGATION =====
function enter(){
document.getElementById("login").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");
}
function openPage(p){
document.getElementById("dashboard").classList.add("hidden");
document.getElementById(p).classList.remove("hidden");
if(p==="stocks") loadStocks();
if(p==="crypto") loadCrypto();
if(p==="profile") loadProfile();
if(p==="admin") loadAdmin();
}
function back(){
document.querySelectorAll("body > div").forEach(d=>d.classList.add("hidden"));
document.getElementById("dashboard").classList.remove("hidden");
}

// ===== MARKET =====
async function loadStocks(){
let list=document.getElementById("stocksList");
list.innerHTML="";
let arr=["AAPL","TSLA","MSFT"];
for(let s of arr){
let r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${s}&token=${API_KEY}`);
let d=await r.json();
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<h3>${s}</h3><p>$${d.c}</p>
<button onclick="buy('${s}',${d.c})">Buy</button>
<button onclick="sell('${s}',${d.c})">Sell</button>`;
list.appendChild(div);
}
}

async function loadCrypto(){
let list=document.getElementById("cryptoList");
list.innerHTML="";
let arr=["BINANCE:BTCUSDT","BINANCE:ETHUSDT"];
for(let s of arr){
let r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${s}&token=${API_KEY}`);
let d=await r.json();
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<h3>${s}</h3><p>$${d.c}</p>
<button onclick="buy('${s}',${d.c})">Buy</button>
<button onclick="sell('${s}',${d.c})">Sell</button>`;
list.appendChild(div);
}
}

// ===== TRADING =====
function buy(asset,price){
let amt=parseFloat(prompt("Amount $"));
if(!amt || amt>balance) return;
let real=price*1.01;
let qty=amt/real;
balance-=amt;
portfolio[asset]=(portfolio[asset]||0)+qty;
save();
alert("Bought");
}
function sell(asset,price){
if(!portfolio[asset]) return;
let qty=parseFloat(prompt("Qty"));
if(!qty || qty>portfolio[asset]) return;
let real=price*0.99;
let total=qty*real;
portfolio[asset]-=qty;
balance+=total;
save();
alert("Sold");
}

// ===== WALLET =====
async function createDeposit(){
let amt=prompt("Enter deposit amount USD / USDT");
if(!amt) return;

// === SIMULATION OF BACKEND ===
deposits.push({amount:amt,status:"pending"});
save();
alert("Deposit created, waiting admin approval");
}

async function requestWithdraw(){
let amt=prompt("Amount to withdraw");
if(!amt) return;

// === SIMULATION OF BACKEND ===
alert("Withdrawal request sent, admin approval required");
}

// ===== ADMIN =====
function loadAdmin(){
let box=document.getElementById("deposits");
box.innerHTML="";
deposits.forEach((d,i)=>{
if(d.status==="pending"){
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<p>$${d.amount}</p>
<button onclick="approve(${i})">Approve</button>`;
box.appendChild(div);
}
});
}
function approve(i){
balance+=parseFloat(deposits[i].amount);
deposits[i].status="done";
save();
loadAdmin();
alert("Approved");
}

// ===== PROFILE =====
function loadProfile(){
let box=document.getElementById("portfolio");
box.innerHTML="";
for(let a in portfolio){
box.innerHTML+=`${a}: ${portfolio[a].toFixed(4)}<br>`;
}
}

// ===== INIT =====
window.onload=()=>{
document.getElementById("balance").innerText=balance;
document.getElementById("address").innerText=walletAddress;
};
</script>

</body>
</html>

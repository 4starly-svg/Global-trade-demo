<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Trade</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

/* ===== BASE ===== */
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background:linear-gradient(180deg,#0a0f1c,#05070d);
  color:#e5e7eb;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  background:#0b1220;
  border-bottom:1px solid #1f2937;
}

#status{
  font-weight:500;
  color:#9ca3af;
}

/* LANGUAGE */
select{
  padding:8px 12px;
  background:#111827;
  color:#e5e7eb;
  border:1px solid #1f2937;
  border-radius:8px;
}

/* PAGES */
.page{
  display:none;
  padding:25px;
}
.active{
  display:block;
}

/* BUTTONS */
.btn{
  padding:12px 16px;
  margin:10px 5px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:500;
  background:linear-gradient(135deg,#1d4ed8,#2563eb);
  color:white;
  transition:0.2s;
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 15px rgba(37,99,235,0.3);
}

/* GRID */
.grid{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

/* CARDS */
.card{
  flex:1;
  min-width:280px;
  background:#0f172a;
  padding:20px;
  border-radius:14px;
  border:1px solid #1f2937;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

/* TITLES */
h1,h2,h3{
  margin:0 0 10px 0;
  font-weight:500;
}

/* INPUTS */
input{
  padding:10px;
  width:220px;
  margin:8px 0;
  background:#111827;
  border:1px solid #1f2937;
  color:white;
  border-radius:8px;
}

/* LIVE DATA */
.live{
  font-size:16px;
  margin-top:10px;
  padding:10px;
  border-radius:8px;
  background:#020617;
  border:1px solid #1f2937;
}

/* MEDIA */
video,audio{
  width:100%;
  border-radius:10px;
  margin-top:10px;
}

/* DISCLAIMER */
.disclaimer{
  margin-top:20px;
  font-size:12px;
  color:#6b7280;
}

</style>
</head>

<body>

<div class="header">
  <div id="status">Not Logged In</div>

  <select onchange="changeLang(this.value)">
    <option value="en">English</option>
    <option value="ar">العربية</option>
  </select>
</div>

<!-- LOGIN -->
<div id="login" class="page active">
<h2 id="loginTitle">Login</h2>

<input placeholder="Email"><br>
<input type="password" placeholder="Password"><br>

<button class="btn" onclick="enter()">Login</button>
<button class="btn" onclick="enter()">Guest</button>
</div>

<!-- DASHBOARD -->
<div id="home" class="page">

<h1 id="homeTitle">Global Trade Dashboard</h1>

<div class="grid">

<!-- STOCK -->
<div class="card">
<h3>Stocks</h3>
<div id="stockChart" style="height:300px;"></div>
</div>

<!-- CRYPTO -->
<div class="card">
<h3>Crypto</h3>
<div id="cryptoChart" style="height:300px;"></div>
</div>

<!-- GOLD / OIL -->
<div class="card">
<h3>Gold & Oil</h3>
<div id="gold" class="live"></div>
<div id="oil" class="live"></div>
</div>

<!-- LEARN -->
<div class="card">
<h3>Learn Trading</h3>

<video controls>
<source src="https://www.w3schools.com/html/mov_bbb.mp4">
</video>

<audio controls>
<source src="https://www.w3schools.com/html/horse.mp3">
</audio>

</div>

</div>

<button class="btn" onclick="logout()">Logout</button>

<div class="disclaimer">
Trading involves risk. التداول ينطوي على مخاطر
</div>

</div>

<script>

/* LOGIN */
function enter(){
document.getElementById("login").classList.remove("active")
document.getElementById("home").classList.add("active")
document.getElementById("status").innerText="Logged In"
loadCharts()
}

function logout(){
location.reload()
}

/* LANGUAGE */
function changeLang(lang){
if(lang=="ar"){
document.getElementById("loginTitle").innerText="تسجيل الدخول"
document.getElementById("homeTitle").innerText="لوحة التحكم"
}else{
document.getElementById("loginTitle").innerText="Login"
document.getElementById("homeTitle").innerText="Global Trade Dashboard"
}
}

/* LIVE GOLD/OIL */
setInterval(()=>{
document.getElementById("gold").innerText="Gold: $"+(1900+Math.random()*20).toFixed(2)
document.getElementById("oil").innerText="Oil: $"+(70+Math.random()*5).toFixed(2)
},2000)

/* CHARTS */
function loadCharts(){

new TradingView.widget({
container_id:"stockChart",
autosize:true,
symbol:"NASDAQ:AAPL",
theme:"dark",
style:"1"
})

new TradingView.widget({
container_id:"cryptoChart",
autosize:true,
symbol:"BINANCE:BTCUSDT",
theme:"dark",
style:"1"
})

}

</script>

</body>
</html>

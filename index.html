<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>GLOBAL TRADE | نظام الإدارة والعمليات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #d4af37; --navy: #020617; --card: #0f172a; --emerald: #10b981; }
        body { background: var(--navy); color: white; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        
        /* AUTH OVERLAY */
        #auth-overlay { position: fixed; inset: 0; background: var(--navy); z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .login-box { background: var(--card); padding: 40px; border: 2px solid var(--gold); border-radius: 20px; width: 350px; text-align: center; }
        
        /* ADMIN PANEL STYLING */
        #admin-panel { display: none; padding: 40px; text-align: center; overflow-y: auto; height: 100vh; }
        .user-row { background: #000; border: 1px solid #1e293b; padding: 15px; margin: 10px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        /* USER APP STYLING */
        #user-app { display: none; flex-direction: column; height: 100vh; }
        nav { height: 70px; background: #000; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-around; align-items: center; }
        .screen { display: none; flex: 1; padding: 30px; text-align: center; justify-content: center; flex-direction: column; align-items: center; }
        .screen.active { display: flex; }

        .balance-txt { font-size: 70px; font-weight: 900; color: var(--emerald); }
        .input-dark { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid var(--gold); color: white; border-radius: 8px; text-align: center; }
        .btn-gold { background: var(--gold); color: black; border: none; padding: 12px 25px; font-weight: 900; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="login-box">
            <h2 style="color:var(--gold)">تسجيل الدخول</h2>
            <input type="text" id="acc_id" class="input-dark" placeholder="رقم المحفظة">
            <input type="password" id="acc_pass" class="input-dark" placeholder="كلمة المرور">
            <button class="btn-gold" onclick="login()">دخول آمن</button>
        </div>
    </div>

    <div id="admin-panel">
        <h1 style="color:var(--gold)">لوحة تحكم المدير</h1>
        <div id="user-list">
            </div>
        <button class="btn-gold" style="margin-top:20px;" onclick="location.reload()">تحديث البيانات</button>
    </div>

    <div id="user-app">
        <nav>
            <button onclick="tab('u-home')" class="btn-gold" style="background:none; color:var(--gold)">المحفظة</button>
            <button onclick="tab('u-stocks')" class="btn-gold" style="background:none; color:white">الأسهم</button>
            <button onclick="tab('u-wa')" class="btn-gold" style="background:none; color:white">الدعم</button>
        </nav>
        
        <div id="u-home" class="screen active">
            <h2 id="welcome-name">مرحباً</h2>
            <div class="balance-txt" id="live-bal">$0.00</div>
            <p style="color:#94a3b8">الرصيد المباشر متاح للسحب</p>
            <button class="btn-gold" onclick="window.location.href='https://wa.me/218915709015?text=DEPOSIT'">إيداع جديد</button>
        </div>

        <div id="u-stocks" class="screen">
            <iframe src="https://www.tradingview.com/widgetembed/?symbol=NASDAQ%3ATSLA&theme=dark&locale=ar" style="width:100%; height:500px; border:1px solid var(--gold); border-radius:15px;"></iframe>
        </div>

        <div id="u-wa" class="screen">
            <div style="background:var(--card); padding:30px; border-radius:15px; border:1px solid var(--gold)">
                <h3>تواصل مع مكتب العمليات</h3>
                <p>واتساب: +218 91 570 9015</p>
                <button class="btn-gold" onclick="window.location.href='https://wa.me/218915709015'">فتح المحادثة</button>
            </div>
        </div>
    </div>

<script>
    // These link to your GitHub Secrets/Stored API
    const SB_URL = 'YOUR_SUPABASE_URL';
    const SB_KEY = 'YOUR_SUPABASE_KEY';
    const supabase = exports.createClient(SB_URL, SB_KEY);

    let currentUser = null;

    async function login() {
        const id = document.getElementById('acc_id').value;
        const pass = document.getElementById('acc_pass').value;

        // ADMIN LOGIN (Hardcoded for you)
        if(id === "ADMIN-GT" && pass === "LIBYA2026") {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            loadAdminData();
            return;
        }

        // CLIENT LOGIN
        let { data: user, error } = await supabase.from('users').select('*').eq('account_id', id).single();

        if (user && pass === user.password) {
            currentUser = user;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('user-app').style.display = 'flex';
            document.getElementById('welcome-name').innerText = "مرحباً بك، " + user.full_name;
            document.getElementById('live-bal').innerText = "$" + user.balance.toLocaleString();
        } else {
            alert("بيانات الدخول غير صحيحة");
        }
    }

    // ADMIN FUNCTION: Update balance with one click
    async function loadAdminData() {
        let { data: users } = await supabase.from('users').select('*');
        const list = document.getElementById('user-list');
        list.innerHTML = '';
        users.forEach(u => {
            list.innerHTML += `
                <div class="user-row">
                    <span>${u.full_name} (${u.account_id})</span>
                    <input type="number" id="bal-${u.id}" value="${u.balance}" style="width:100px; background:#222; color:white; border:1px solid var(--gold)">
                    <button class="btn-gold" onclick="updateBal('${u.id}')">تحديث الرصيد</button>
                </div>
            `;
        });
    }

    async function updateBal(userId) {
        const newBal = document.getElementById('bal-' + userId).value;
        const { error } = await supabase.from('users').update({ balance: newBal }).eq('id', userId);
        if(!error) alert("تم تحديث الرصيد بنجاح");
    }

    function tab(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>

<div class="card">
    <h3 id="l-fx">USD/LYD Rate (Parallel)</h3>
    <div class="price" id="black-rate" style="color: #d35400;">7.34 LYD</div> 
    <p id="l-blackmarket">Last Updated: Just Now</p>
    <div style="font-size: 12px; color: #7f8c8d;">
        Official Bank: 6.39 LYD <br>
        Your Profit Spread: +0.95 LYD
    </div>
    <button class="btn-trade" onclick="openAdmin()" style="margin-top:10px; font-size:10px; background:#eee; color:#666;">Admin: Update Rate</button>
</div>

<div id="admin-panel" class="hidden" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border:2px solid var(--gold); border-radius:10px; z-index:2000;">
    <h4>Update Street Rate</h4>
    <input type="number" id="new-rate" step="0.01" placeholder="7.34">
    <button onclick="updateRate()" class="btn-trade">Save Rate</button>
    <button onclick="closeAdmin()" style="border:none; background:none; cursor:pointer;">Close</button>
</div>

<script>
    // THE SECRET ADMIN LOGIC
    function openAdmin() {
        let pin = prompt("Enter Admin PIN:");
        if(pin === "1234") { // You can change this PIN
            document.getElementById('admin-panel').classList.remove('hidden');
        } else {
            alert("Wrong PIN!");
        }
    }

    function updateRate() {
        const val = document.getElementById('new-rate').value;
        if(val) {
            document.getElementById('black-rate').innerText = val + " LYD";
            document.getElementById('admin-panel').classList.add('hidden');
            alert("Rate updated for all users!");
        }
    }

    function closeAdmin() {
        document.getElementById('admin-panel').classList.add('hidden');
    }
</script>

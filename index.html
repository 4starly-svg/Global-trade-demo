<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL TRADE LTD | LIVE CLOUD TERMINAL</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --bg: #050505; --border: #1e293b; --emerald: #10b981; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: 0.5s; }
        body, html { height: 100%; margin: 0; background: var(--bg); color: #f1f5f9; overflow: hidden; }

        /* 🔐 THE VAULT ENTRY */
        #vault-gate { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .vault-box { width: 420px; text-align: center; border: 1px solid var(--border); padding: 60px; background: #050505; border-radius: 4px; box-shadow: 0 0 50px rgba(197, 160, 89, 0.05); }
        .vault-box h1 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 28px; letter-spacing: 5px; margin-bottom: 40px; }
        .key-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border); padding: 15px; color: white; text-align: center; font-size: 16px; margin-bottom: 30px; letter-spacing: 5px; outline: none; }
        .key-input:focus { border-bottom-color: var(--gold); }
        .access-btn { background: var(--gold); color: black; border: none; padding: 18px; width: 100%; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }

        /* 📊 INTERFACE */
        #terminal { display: none; height: 100vh; flex-direction: column; }
        header { height: 80px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 50px; background: #000; }
        .brand { font-family: 'Cinzel', serif; color: var(--gold); font-weight: 600; font-size: 16px; letter-spacing: 3px; }
        .nav-links { display: flex; gap: 40px; }
        .nav-item { color: #475569; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
        .nav-item.active { color: var(--gold); }

        /* CONTENT */
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
        .view { display: none; width: 100%; height: 100%; max-width: 1400px; grid-template-columns: 1fr 1fr; gap: 40px; }
        .view.active { display: grid; animation: reveal 0.8s ease; }
        @keyframes reveal { from { opacity: 0; filter: blur(10px); } to { opacity: 1; filter: blur(0); } }

        /* PANELS */
        .glass-panel { background: #000; border: 1px solid var(--border); padding: 50px; display: flex; flex-direction: column; justify-content: center; }
        .label { color: var(--gold); font-size: 10px; font-weight: 900; letter-spacing: 3px; margin-bottom: 10px; }
        .value { font-size: 75px; font-weight: 900; color: white; margin-bottom: 10px; letter-spacing: -2px; }
        .status { color: var(--emerald); font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .status::before { content: ""; width: 8px; height: 8px; background: var(--emerald); border-radius: 50%; }

        .btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 15px 30px; font-weight: 900; font-size: 11px; cursor: pointer; margin-top: 30px; width: fit-content; text-transform: uppercase; letter-spacing: 1px; }
        .btn-outline:hover { background: var(--gold); color: black; }

        /* TRADING */
        .form-input { width: 100%; background: #0a0a0a; border: 1px solid var(--border); padding: 15px; color: white; margin-bottom: 15px; }
        iframe { width: 100%; height: 100%; border: none; }

        .footer-logos { margin-top: 40px; display: flex; gap: 30px; opacity: 0.3; filter: invert(1); }
        .footer-logos img { height: 20px; }
    </style>
</head>
<body>

    <div id="vault-gate">
        <div class="vault-box">
            <h1>GLOBAL TRADE</h1>
            <input type="password" id="private-key" class="key-input" placeholder="PRIVATE KEY">
            <button class="access-btn" id="login-btn" onclick="authorize()">Open Secure Session</button>
            <p id="error" style="color:#ef4444; font-size:11px; margin-top:20px; display:none;">ACCESS DENIED: KEY UNRECOGNIZED</p>
        </div>
    </div>

    <div id="terminal">
        <header>
            <div class="brand">GLOBAL TRADE LTD</div>
            <div class="nav-links">
                <div class="nav-item active" onclick="tab('v-home', this)">Portfolio</div>
                <div class="nav-item" onclick="tab('v-trade', this)">Execution</div>
                <div class="nav-item" onclick="tab('v-hq', this)">Network</div>
            </div>
            <div id="user-tag" style="font-size: 10px; color: var(--gold); font-weight: 900; letter-spacing: 1px;">ENCRYPTED SESSION</div>
        </header>

        <main>
            <div id="v-home" class="view active">
                <div class="glass-panel">
                    <div class="label" id="user-greeting">ACCOUNT EQUITY</div>
                    <div class="value" id="user-balance">$0.00</div>
                    <div class="status">LIQUIDITY VERIFIED BY CBL</div>
                    
                    <button class="btn-outline" onclick="window.location.href='https://wa.me/218915709015'">Instant Withdrawal</button>
                    
                    <div class="footer-logos">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg">
                    </div>
                </div>
                <div style="border: 1px solid var(--border);">
                    <iframe src="https://www.tradingview.com/widgetembed/?symbol=OANDA:XAUUSD&theme=dark"></iframe>
                </div>
            </div>

            <div id="v-trade" class="view">
                <div style="border: 1px solid var(--border);">
                    <iframe src="https://www.tradingview.com/widgetembed/?symbol=BITSTAMP:BTCUSD&theme=dark"></iframe>
                </div>
                <div class="glass-panel">
                    <div class="label">EXECUTION DESK</div>
                    <input type="text" id="t-sym" class="form-input" placeholder="Symbol (XAU/USD)">
                    <input type="number" id="t-amt" class="form-input" placeholder="Volume (USD)">
                    <button class="access-btn" style="background:var(--emerald); color:white;" onclick="exec('BUY')">Place Buy Order</button>
                    <button class="access-btn" style="background:#ef4444; color:white; margin-top:10px;" onclick="exec('SELL')">Place Sell Order</button>
                </div>
            </div>

            <div id="v-hq" class="view">
                <div class="glass-panel">
                    <div class="label">EXECUTIVE AUDIO</div>
                    <button class="btn-outline" onclick="speak()">Initialize Briefing 🎙️</button>
                </div>
                <div class="glass-panel">
                    <div class="label">INSTITUTIONAL LINE</div>
                    <p style="font-size: 24px; font-weight: 900;">+218 91 570 9015</p>
                    <button class="access-btn" onclick="window.location.href='https://wa.me/218915709015'">Secure WhatsApp</button>
                </div>
            </div>
        </main>
    </div>

<script>
    // 🏦 CLOUD CONFIGURATION
    // Replace these with your own Supabase credentials later
    const SUPABASE_URL = "YOUR_SUPABASE_URL_HERE"; 
    const SUPABASE_KEY = "YOUR_SUPABASE_KEY_HERE";
    const supabase = (SUPABASE_URL !== "YOUR_SUPABASE_URL_HERE") ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    // LOCAL DATABASE (Fallback until you connect Supabase)
    const localData = {
        "GT-777": { name: "VIP INVESTOR", balance: "$25,000.00" },
        "GT-100": { name: "PRIVATE CLIENT", balance: "$10,000.00" }
    };

    function authorize() {
        const key = document.getElementById('private-key').value;
        const btn = document.getElementById('login-btn');
        btn.innerText = "VERIFYING...";

        setTimeout(() => {
            if (localData[key]) {
                const user = localData[key];
                document.getElementById('vault-gate').style.display = 'none';
                document.getElementById('terminal').style.display = 'flex';
                document.getElementById('user-greeting').innerText = `WELCOME, ${user.name}`;
                document.getElementById('user-balance').innerText = user.balance;
            } else {
                document.getElementById('error').style.display = 'block';
                btn.innerText = "Open Secure Session";
            }
        }, 1200);
    }

    function tab(id, el) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    function speak() {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance("مرحباً بكم في جلوبال تريد ليميتد. تم التحقق من هويتك وسيولة حسابك. نحن جاهزون للعمل.");
        msg.lang = 'ar-SA';
        window.speechSynthesis.speak(msg);
    }

    function exec(type) {
        const s = document.getElementById('t-sym').value;
        const a = document.getElementById('t-amt').value;
        window.location.href = `https://wa.me/218915709015?text=ORDER_${type}_${a}_${s}`;
    }
</script>
</body>
</html>

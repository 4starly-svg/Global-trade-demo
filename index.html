<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Trade System</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#0a0f1c;
    color:white;
}

/* CENTER EVERYTHING */
.center {
    display:flex;
    justify-content:center;
    align-items:center;
}

/* LOGIN */
#loginPage {
    height:100vh;
    flex-direction:column;
}

.login-box {
    background:#1f2937;
    padding:30px;
    border-radius:12px;
    width:300px;
    text-align:center;
}

input {
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:6px;
    border:none;
}

/* BUTTONS */
button {
    padding:10px;
    margin:5px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.buy { background:green; color:white; }
.sell { background:red; color:white; }

/* DASHBOARD */
#dashboard {
    display:none;
    padding:20px;
}

/* TABLE */
table {
    width:100%;
    text-align:center;
    background:#111827;
    border-radius:10px;
}

td, th {
    padding:8px;
}

/* ALERT */
#alertBox {
    position:fixed;
    top:20px;
    right:20px;
    background:#111827;
    padding:15px;
    border-radius:10px;
    display:none;
}

/* TRADE PANEL */
#tradePanel {
    position:fixed;
    bottom:0;
    width:100%;
    background:#111827;
    padding:10px;
    text-align:center;
}
</style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="loginPage" class="center">
    <div class="login-box">
        <h2>Global Trade</h2>
        <input placeholder="Email">
        <input placeholder="Password" type="password">
        <button onclick="enter()">Login</button>
        <button onclick="guest()">Enter as Guest</button>
    </div>
</div>

<!-- 📊 DASHBOARD -->
<div id="dashboard">

<h2 style="text-align:center;">🔥 Ultimate Trading Dashboard</h2>

<!-- CHART -->
<div id="chart" style="height:400px;"></div>

<!-- SCANNER -->
<h3>🚀 Market Scanner</h3>
<table>
<thead>
<tr>
<th>Symbol</th>
<th>Price</th>
<th>%</th>
<th>Rel Vol</th>
<th>Float</th>
<th>News</th>
<th>Signal</th>
<th>Trade</th>
</tr>
</thead>
<tbody id="scanner"></tbody>
</table>

</div>

<!-- ALERT -->
<div id="alertBox"></div>

<audio id="sound">
<source src="https://www.soundjay.com/buttons/beep-01a.mp3">
</audio>

<!-- TRADE PANEL -->
<div id="tradePanel">
<input id="symbol" placeholder="Symbol">
<input id="amount" placeholder="$ Amount">
<button class="buy" onclick="buy()">BUY</button>
<button class="sell" onclick="sell()">SELL</button>
</div>

<script>

// LOGIN
function enter() {
    document.getElementById("loginPage").style.display="none";
    document.getElementById("dashboard").style.display="block";
    initChart("TSLA");
}

function guest() {
    localStorage.setItem("guest", true);
    enter();
}

// ALERT
function alertMe(msg){
    let box = document.getElementById("alertBox");
    box.innerText = msg;
    box.style.display="block";
    document.getElementById("sound").play();
    setTimeout(()=>box.style.display="none",3000);
}

// TRADE
function buy(){
    alert("BUY " + symbol.value);
}
function sell(){
    alert("SELL " + symbol.value);
}
function select(symbolName){
    document.getElementById("symbol").value = symbolName;
}

// CHART (REAL TRADINGVIEW)
function initChart(sym){
    new TradingView.widget({
        container_id: "chart",
        width: "100%",
        height: 400,
        symbol: sym,
        interval: "5",
        timezone: "Etc/UTC",
        theme: "dark",
        style: "1",
        studies: ["RSI@tv-basicstudies","VWAP@tv-basicstudies"]
    });
}

// DATA
const API_KEY = "YOUR_FINNHUB_API_KEY";

const stocks = ["TSLA","NVDA","AMD","ISPC","NVOS","GNS"];

const floatData = {
"ISPC":"Low","NVOS":"Low","GNS":"Low",
"TSLA":"High","NVDA":"High","AMD":"High"
};

let volumeTrack = {};

async function scan(){

    let table = document.getElementById("scanner");
    table.innerHTML="";

    for(let s of stocks){

        let res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${s}&token=${API_KEY}`);
        let d = await res.json();

        let price = d.c;
        let change = d.dp;

        let vol = d.v || Math.random()*1000000;

        if(!volumeTrack[s]) volumeTrack[s]=vol;
        let rel = vol / volumeTrack[s];
        volumeTrack[s]=vol;

        let float = floatData[s] || "Unknown";

        let news = Math.random()>0.5;

        let signal="WAIT", color="white";

        if(change>5 && rel>1.5 && float=="Low" && news){
            signal="🚀 BREAKOUT";
            color="lime";
            alertMe(s+" BREAKOUT");
        }
        else if(rel>2){
            signal="⚡ VOLUME";
            color="yellow";
            alertMe(s+" VOLUME SPIKE");
        }

        if(rel>1.2 || change>2){

            let row = document.createElement("tr");

            row.innerHTML=`
            <td>${s}</td>
            <td>$${price}</td>
            <td style="color:${change>=0?'lime':'red'}">${change}%</td>
            <td>${rel.toFixed(2)}x</td>
            <td>${float}</td>
            <td>${news?'📰':''}</td>
            <td style="color:${color}">${signal}</td>
            <td><button onclick="select('${s}');initChart('${s}')">Trade</button></td>
            `;

            table.appendChild(row);
        }
    }
}

setInterval(scan,4000);
scan();

</script>

</body>
</html>

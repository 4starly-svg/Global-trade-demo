<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global Trade Capital</title>
<style>
  body { font-family: Arial, sans-serif; background:#121212; color:#fff; margin:0; padding:0; }
  .container { display:flex; justify-content:center; align-items:center; height:100vh; flex-wrap:wrap; gap:20px; }
  .card { background:#1e1e1e; padding:20px; border-radius:10px; text-align:center; min-width:200px; transition:0.3s; box-shadow:0 0 10px #000; }
  .card:hover { box-shadow:0 0 20px #0f0; transform:translateY(-5px); }
  button { padding:10px 15px; margin-top:10px; cursor:pointer; border:none; border-radius:5px; background:#0f0; color:#000; font-weight:bold; }
  input { padding:5px; margin:5px 0; border-radius:5px; border:none; width:80%; }
  .card-container { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; }
</style>
</head>
<body>

<div class="container" id="folders">
  <div class="card" onclick="loadStocks()"><span id="stocksLabel">Stocks</span></div>
  <div class="card" onclick="loadCrypto()"><span id="cryptoLabel">Crypto</span></div>
  <div class="card" onclick="loadCommodities()"><span id="commoditiesLabel">Gold/Oil</span></div>
  <div class="card" onclick="loadSoccer()"><span id="soccerLabel">Soccer</span></div>
  <div class="card" onclick="loadWallet()"><span id="walletLabel">Wallet</span></div>
  <div class="card" onclick="loadLearnContact()"><span id="learnLabel">Learn / Contact</span></div>
</div>

<div id="content" style="padding:20px;"></div>

<div style="position:fixed; top:10px; right:10px;">
  <button onclick="toggleLanguage()"><span id="langBtn">Arabic</span></button>
</div>

<script>
let currentLang='en';

// ------------------ Language Toggle ------------------
function toggleLanguage(){
  currentLang = currentLang==='en'?'ar':'en';
  document.getElementById('stocksLabel').textContent = currentLang==='en'?'Stocks':'الأسهم';
  document.getElementById('cryptoLabel').textContent = currentLang==='en'?'Crypto':'العملات';
  document.getElementById('commoditiesLabel').textContent = currentLang==='en'?'Gold/Oil':'الذهب/النفط';
  document.getElementById('soccerLabel').textContent = currentLang==='en'?'Soccer':'كرة القدم';
  document.getElementById('walletLabel').textContent = currentLang==='en'?'Wallet':'المحفظة';
  document.getElementById('learnLabel').textContent = currentLang==='en'?'Learn / Contact':'تعلم / اتصل';
  document.getElementById('langBtn').textContent = currentLang==='en'?'Arabic':'الإنجليزية';
  document.getElementById('content').innerHTML='';
}

// ------------------ Stocks ------------------
async function loadStocks(){
  const content = document.getElementById('content'); content.innerHTML='';
  const resp = await fetch('http://localhost:5000/api/stocks');
  const stocks = await resp.json();
  const container = document.createElement('div'); container.className='card-container';
  stocks.forEach(s=>{ 
    const card = document.createElement('div'); card.className='card';
    card.innerHTML=`${s.symbol}: $${s.price}`;
    container.appendChild(card);
  });
  content.appendChild(container);
}

// ------------------ Crypto ------------------
async function loadCrypto(){
  const content = document.getElementById('content'); content.innerHTML='';
  const resp = await fetch('http://localhost:5000/api/crypto');
  const data = await resp.json();
  const container = document.createElement('div'); container.className='card-container';
  for(const key in data){
    const card = document.createElement('div'); card.className='card';
    card.innerHTML=`${key.toUpperCase()}: $${data[key].usd}`;
    container.appendChild(card);
  }
  content.appendChild(container);
}

// ------------------ Commodities ------------------
async function loadCommodities(){
  const content = document.getElementById('content'); content.innerHTML='';
  const resp = await fetch('http://localhost:5000/api/commodities');
  const data = await resp.json();
  const container = document.createElement('div'); container.className='card-container';
  const goldCard = document.createElement('div'); goldCard.className='card';
  goldCard.innerHTML=`${currentLang==='en'?'Gold':'الذهب'}: $${data.gold}`;
  container.appendChild(goldCard);
  const oilCard = document.createElement('div'); oilCard.className='card';
  oilCard.innerHTML=`${currentLang==='en'?'Oil':'النفط'}: $${data.oil}`;
  container.appendChild(oilCard);
  content.appendChild(container);
}

// ------------------ Soccer ------------------
async function loadSoccer(){
  const content = document.getElementById('content'); content.innerHTML='';
  const resp = await fetch('http://localhost:5000/api/soccer');
  const matches = await resp.json();
  const container = document.createElement('div'); container.className='card-container';
  matches.forEach(m=>{
    const card = document.createElement('div'); card.className='card';
    card.innerHTML=`
      <div>
        <img src="${m.team1_logo}" width="50" height="50"/> 
        <span>${currentLang==='en'?m.team1:m.team1_ar||m.team1}</span> 
        <span>vs</span>
        <img src="${m.team2_logo}" width="50" height="50"/> 
        <span>${currentLang==='en'?m.team2:m.team2_ar||m.team2}</span>
        <p>${currentLang==='en'?m.league:m.league_ar||m.league}</p>
        <p>${m.date} ${m.time}</p>
        <button onclick="betUSDT(${m.bet})">${currentLang==='en'?'Bet USDT':'راهن بعملة USDT'} (${m.bet})</button>
      </div>
    `;
    container.appendChild(card);
  });

  // Libya contact info card
  const contactCard = document.createElement('div'); contactCard.className='card';
  contactCard.innerHTML=`
    <h3>${currentLang==='en'?'Libya Wager Info':'معلومات الرهان في ليبيا'}</h3>
    <p>${currentLang==='en'?'To place a wager or bet, call or message this number:':'لوضع رهان، اتصل أو أرسل رسالة على هذا الرقم:'}</p>
    <p>+218-914-948944</p>
  `;
  container.appendChild(contactCard);

  content.appendChild(container);
}

// ------------------ Wallet ------------------
function loadWallet(){
  const content = document.getElementById('content'); content.innerHTML='';
  const container = document.createElement('div'); container.className='card-container';

  // USDT Deposit
  const depositCard = document.createElement('div'); depositCard.className='card';
  depositCard.innerHTML=`
    <h3>${currentLang==='en'?'USDT Deposit':'إيداع USDT'}</h3>
    <input type="text" id="depositAddress" placeholder="${currentLang==='en'?'Wallet Address':'عنوان المحفظة'}"/>
    <input type="number" id="depositAmount" placeholder="${currentLang==='en'?'Amount':'المبلغ'}"/>
    <button onclick="usdtDeposit()">${currentLang==='en'?'Deposit':'إيداع'}</button>
  `;
  container.appendChild(depositCard);

  // USDT Withdraw
  const withdrawCard = document.createElement('div'); withdrawCard.className='card';
  withdrawCard.innerHTML=`
    <h3>${currentLang==='en'?'USDT Withdraw':'سحب USDT'}</h3>
    <input type="text" id="withdrawAddress" placeholder="${currentLang==='en'?'Wallet Address':'عنوان المحفظة'}"/>
    <input type="number" id="withdrawAmount" placeholder="${currentLang==='en'?'Amount':'المبلغ'}"/>
    <button onclick="usdtWithdraw()">${currentLang==='en'?'Withdraw':'سحب'}</button>
  `;
  container.appendChild(withdrawCard);

  content.appendChild(container);
}

// ------------------ USDT Wallet Functions ------------------
async function usdtDeposit(){
  const address = document.getElementById('depositAddress').value;
  const amount = parseFloat(document.getElementById('depositAmount').value);
  if(!address||!amount) return alert(currentLang==='en'?'Enter valid info':'أدخل معلومات صالحة');
  const resp = await fetch('http://localhost:5000/api/usdt/deposit',{
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({address, amount})
  });
  const data = await resp.json(); alert(data.message);
}

async function usdtWithdraw(){
  const address = document.getElementById('withdrawAddress').value;
  const amount = parseFloat(document.getElementById('withdrawAmount').value);
  if(!address||!amount) return alert(currentLang==='en'?'Enter valid info':'أدخل معلومات صالحة');
  const resp = await fetch('http://localhost:5000/api/usdt/withdraw',{
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({address, amount})
  });
  const data = await resp.json(); alert(data.message);
}

// ------------------ Soccer Bet ------------------
function betUSDT(amount){
  const walletAddress = prompt(currentLang==='en'?'Enter your USDT wallet address':'أدخل عنوان محفظة USDT الخاصة بك');
  if(!walletAddress) return;
  fetch('http://localhost:5000/api/usdt/withdraw',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({address:walletAddress, amount})
  }).then(r=>r.json()).then(d=>alert(d.message));
}

// ------------------ Learn / Contact ------------------
function loadLearnContact(){
  const content = document.getElementById('content'); content.innerHTML='';
  const container = document.createElement('div'); container.className='card-container';
  const learnCard = document.createElement('div'); learnCard.className='card';
  learnCard.innerHTML=`${currentLang==='en'?'Learn Trading':'تعلم التداول'}`;
  container.appendChild(learnCard);
  const contactCard = document.createElement('div'); contactCard.className='card';
  contactCard.innerHTML=`${currentLang==='en'?'Contact Us: +218-XXX-XXXX':'اتصل بنا: +218-XXX-XXXX'}`;
  container.appendChild(contactCard);
  content.appendChild(container);
}
</script>
</body>
</html>

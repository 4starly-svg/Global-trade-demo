  .card:hover { box-shadow:0 0 20px #0f0; transform:translateY(-5px); }
  button { padding:10px 15px; margin-top:10px; cursor:pointer; border:none; border-radius:5px; background:#0f0; color:#000; font-weight:bold; }
  input { padding:5px; margin:5px 0; border-radius:5px; border:none; width:80%; }
  .card-container { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; }

let currentLang='en';

// ------------------ Language Toggle ------------------
function toggleLanguage(){
  currentLang = currentLang==='en'?'ar':'en';
  document.getElementById('stocksLabel').textContent = currentLang==='en'?'Stocks':'الأسهم';
  document.getElementById('cryptoLabel').textContent = currentLang==='en'?'Crypto':'العملات';
  document.getElementById('commoditiesLabel').textContent = currentLang==='en'?'Gold/Oil':'الذهب/النفط';
  document.getElementById('soccerLabel').textContent = currentLang==='en'?'Soccer':'كرة القدم';
  document.getElementById('walletLabel').textContent = currentLang==='en'?'Wallet':'المحفظة';
  document.getElementById('bankLabel').textContent = currentLang==='en'?'Libyan Bank':'البنك الليبي';
  document.getElementById('learnLabel').textContent = currentLang==='en'?'Learn / Contact':'تعلم / اتصل';
  document.getElementById('langBtn').textContent = currentLang==='en'?'Arabic':'الإنجليزية';
  document.getElementById('content').innerHTML='';
}

// ------------------ Libyan Bank Integration ------------------
function loadBank(){
  const content = document.getElementById('content'); content.innerHTML='';
  const container = document.createElement('div'); container.className='card-container';

  // Deposit
  const depositCard = document.createElement('div'); depositCard.className='card';
  depositCard.innerHTML=`
    <h3>${currentLang==='en'?'Deposit via Libyan Bank':'الإيداع عبر البنك الليبي'}</h3>
    <input type="text" id="bankAccount" placeholder="${currentLang==='en'?'Account Number':'رقم الحساب'}"/>
    <input type="number" id="bankAmount" placeholder="${currentLang==='en'?'Amount':'المبلغ'}"/>
    <button onclick="bankDeposit()">${currentLang==='en'?'Deposit':'إيداع'}</button>
  `;
  container.appendChild(depositCard);

  // Withdraw
  const withdrawCard = document.createElement('div'); withdrawCard.className='card';
  withdrawCard.innerHTML=`
    <h3>${currentLang==='en'?'Withdraw via Libyan Bank':'السحب عبر البنك الليبي'}</h3>
    <input type="text" id="bankWithdrawAccount" placeholder="${currentLang==='en'?'Account Number':'رقم الحساب'}"/>
    <input type="number" id="bankWithdrawAmount" placeholder="${currentLang==='en'?'Amount':'المبلغ'}"/>
    <button onclick="bankWithdraw()">${currentLang==='en'?'Withdraw':'سحب'}</button>
  `;
  container.appendChild(withdrawCard);

  content.appendChild(container);
}

async function bankDeposit(){
  const account = document.getElementById('bankAccount').value;
  const amount = parseFloat(document.getElementById('bankAmount').value);
  if(!account||!amount) return alert(currentLang==='en'?'Enter valid info':'أدخل معلومات صالحة');
  const resp = await fetch('http://localhost:5000/api/bank/deposit',{
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({account, amount})
  });
  const data = await resp.json(); alert(data.message);
}

async function bankWithdraw(){
  const account = document.getElementById('bankWithdrawAccount').value;
  const amount = parseFloat(document.getElementById('bankWithdrawAmount').value);
  if(!account||!amount) return alert(currentLang==='en'?'Enter valid info':'أدخل معلومات صالحة');
  const resp = await fetch('http://localhost:5000/api/bank/withdraw',{
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({account, amount})
  });
  const data = await resp.json(); alert(data.message);
}

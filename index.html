<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Trade Capital Dashboard 2050</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
body {margin:0; font-family:'Segoe UI', sans-serif; background:#0a1128; color:#f0f0f0;}
#loginPage {display:flex; justify-content:center; align-items:center; height:100vh; background:linear-gradient(135deg, #0a1128 0%, #1b2a48 100%);}
#loginBox {background:rgba(255,255,255,0.05); backdrop-filter:blur(15px); padding:50px; border-radius:25px; width:400px; display:flex; flex-direction:column; align-items:center; gap:25px; box-shadow:0 15px 35px rgba(0,0,0,0.5);}
#loginBox h2 {margin:0; font-size:32px; display:flex; align-items:center; gap:15px; color:#ffcb77;}
input {width:100%; padding:18px; border-radius:12px; border:none; font-size:18px; background:rgba(255,255,255,0.1); color:white;}
button {width:100%; padding:18px; border:none; border-radius:12px; font-size:18px; cursor:pointer; background:#ff9f1c; color:#1c1c1c; font-weight:bold; transition:0.3s;}
button:hover {background:#ffc16a;}
.lang-toggle-login {cursor:pointer; margin-top:10px; background:#1b2a48; color:white; padding:12px 20px; border-radius:10px; font-weight:bold;}
header {display:none; background:#0b1d3a; color:white; padding:20px 40px; justify-content:space-between; align-items:center;}
header h1 {margin:0; display:flex; align-items:center; gap:15px; font-size:28px; color:#ffcb77;}
header .lang-toggle, header .back-dashboard {cursor:pointer; background:#ffcb77; color:#0b1d3a; border-radius:8px; padding:8px 15px; font-weight:bold; margin-left:10px; transition:0.2s;}
header .lang-toggle:hover, header .back-dashboard:hover {background:#ffd786;}
main {display:none; flex-wrap:wrap; justify-content:center; padding:30px; gap:25px;}
.card {background:rgba(255,255,255,0.05); backdrop-filter:blur(10px); border-radius:20px; width:280px; height:180px; display:flex; flex-direction:column; justify-content:center; align-items:center; box-shadow:0 6px 20px rgba(0,0,0,0.4); cursor:pointer; transition:transform 0.3s, box-shadow 0.3s;}
.card:hover {transform:translateY(-10px) scale(1.05); box-shadow:0 10px 30px rgba(0,0,0,0.6);}
.card img {max-width:70px; margin-bottom:12px;}
.card h2 {margin:0; font-size:20px; text-align:center;}
#sectionContent {margin:25px auto; width:95%; max-width:1280px; display:none;}
.section-box {background:rgba(255,255,255,0.05); padding:20px; border-radius:15px; margin:15px 0;}
.section-box h3 {margin-top:0; color:#ffcb77;}
.section-box table {width:100%; border-collapse:collapse;}
.section-box table th, .section-box table td {border:1px solid rgba(255,255,255,0.2); padding:8px; text-align:center;}
</style>
</head>
<body>

<div id="loginPage">
  <div id="loginBox">
    <h2 id="loginTitle"><img src="https://i.ibb.co/2s4Wp2v/global-trade-logo.png" alt="Logo" style="width:55px; vertical-align:middle;"> Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn" onclick="login()">Login</button>
    <button id="guestBtn" onclick="guestLogin()">Enter as Guest</button>
    <div class="lang-toggle-login" onclick="toggleLanguage()">عربي</div>
  </div>
</div>

<header>
  <h1><img src="https://i.ibb.co/2s4Wp2v/global-trade-logo.png" alt="Logo" style="width:45px;"> Global Trade Capital</h1>
  <div>
    <span class="lang-toggle" onclick="toggleLanguage()">عربي</span>
    <span class="back-dashboard" onclick="backToDashboard()">Back to Dashboard</span>
  </div>
</header>

<main>
  <div class="card" onclick="loadSection('stocks')">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Stocks">
    <h2>Stocks</h2>
  </div>
  <div class="card" onclick="loadSection('crypto')">
    <img src="https://cdn-icons-png.flaticon.com/512/825/825623.png" alt="Crypto">
    <h2>Crypto</h2>
  </div>
  <div class="card" onclick="loadSection('fx')">
    <img src="https://cdn-icons-png.flaticon.com/512/188/188943.png" alt="FX">
    <h2>FX</h2>
  </div>
  <div class="card" onclick="loadSection('commodities')">
    <img src="https://cdn-icons-png.flaticon.com/512/3222/3222932.png" alt="Gold & Oil">
    <h2>Gold & Oil</h2>
  </div>
  <div class="card" onclick="loadSection('soccer')">
    <img src="https://cdn-icons-png.flaticon.com/512/232/232069.png" alt="Soccer">
    <h2>Soccer Predictions</h2>
  </div>
  <div class="card" onclick="loadSection('learn')">
    <img src="https://cdn-icons-png.flaticon.com/512/1250/1250615.png" alt="Learn">
    <h2>Learn / Contact Us</h2>
  </div>
</main>

<div id="sectionContent"></div>

<script>
// ---- Firebase Config ----
const firebaseConfig = {
  apiKey: "YOUR_FIREBASE_API_KEY",
  authDomain: "YOUR_FIREBASE_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_FIREBASE_PROJECT.firebaseio.com",
  projectId: "YOUR_FIREBASE_PROJECT",
  storageBucket: "YOUR_FIREBASE_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// ---- Login Functions ----
function login(){
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;
  auth.signInWithEmailAndPassword(email,password)
      .then(()=>startApp())
      .catch(err=>alert(err.message));
}

function guestLogin(){
  auth.signInAnonymously().then(()=>startApp())
      .catch(err=>alert(err.message));
}

function startApp(){
  document.getElementById('loginPage').style.display='none';
  document.querySelector('header').style.display='flex';
  document.querySelector('main').style.display='flex';
  loadAllSections();
}

// ---- Language Toggle ----
let isArabic=false;
function toggleLanguage(){
  isArabic=!isArabic;
  document.body.dir=isArabic?'rtl':'ltr';
  document.querySelectorAll('.lang-toggle, .lang-toggle-login').forEach(el=>el.innerText=isArabic?'EN':'عربي');
  document.getElementById('loginTitle').innerHTML=`<img src='https://i.ibb.co/2s4Wp2v/global-trade-logo.png' style='width:55px; vertical-align:middle;'> ${isArabic?'تسجيل الدخول':'Login'}`;
  document.getElementById('loginBtn').innerText=isArabic?'تسجيل الدخول':'Login';
  document.getElementById('guestBtn').innerText=isArabic?'الدخول كزائر':'Enter as Guest';
  document.querySelectorAll('.card h2').forEach((h2,i)=>{
    const texts=[['Stocks','Crypto','FX','Gold & Oil','Soccer Predictions','Learn / Contact Us'],
                 ['الأسهم','العملات الرقمية','العملات الأجنبية','الذهب والنفط','توقعات كرة القدم','تعلم / اتصل بنا']];
    h2.innerText=isArabic?texts[1][i]:texts[0][i];
  });
}

// ---- Back Button ----
function backToDashboard(){
  document.getElementById('sectionContent').style.display='none';
  document.querySelector('main').style.display='flex';
}

// ---- Load Sections Inline ----
function loadSection(name){
  document.querySelector('main').style.display='none';
  const sectionDiv=document.getElementById('sectionContent');
  sectionDiv.style.display='block';
  sectionDiv.innerHTML=''; // Clear previous
  if(name==='stocks') loadStocks(sectionDiv);
  if(name==='crypto') loadCrypto(sectionDiv);
  if(name==='fx') loadFX(sectionDiv);
  if(name==='commodities') loadCommodities(sectionDiv);
  if(name==='soccer') loadSoccer(sectionDiv);
  if(name==='learn') loadLearn(sectionDiv);
}

// ---- Section Content ----
function loadAllSections(){
  const div=document.getElementById('sectionContent');
  div.style.display='block';
  div.innerHTML='<!-- Sections will load on click -->';
}

// ---- Example Section Loaders ----
function loadStocks(container){
  container.innerHTML=`<div class="section-box"><h3>${isArabic?'الأسهم':'Stocks'}</h3>
    <table><tr><th>Symbol</th><th>Price</th></tr>
    <tr><td>AAPL</td><td>$150</td></tr>
    <tr><td>GOOG</td><td>$2700</td></tr>
    </table></div>`;
}

function loadCrypto(container){
  container.innerHTML=`<div class="section-box"><h3>${isArabic?'العملات الرقمية':'Crypto'}</h3>
    <table><tr><th>Coin</th><th>Price</th></tr>
    <tr><td>BTC</td><td>$28,000</td></tr>
    <tr><td>ETH</td><td>$1,800</td></tr>
    </table></div>`;
}

function loadFX(container){
  container.innerHTML=`<div class="section-box"><h3>${isArabic?'العملات الأجنبية':'FX'}</h3>
    <table><tr><th>Pair</th><th>Rate</th></tr>
    <tr><td>USD/EUR</td><td>0.93</td></tr>
    <tr><td>USD/LYD</td><td>4.80</td></tr>
    </table></div>`;
}

function loadCommodities(container){
  container.innerHTML=`<div class="section-box"><h3>${isArabic?'الذهب والنفط':'Gold & Oil'}</h3>
    <table><tr><th>Commodity</th><th>Price</th></tr>
    <tr><td>Gold</td><td>$1,950</td></tr>
    <tr><td>Oil</td><td>$85</td></tr>
    </table></div>`;
}

function loadSoccer(container){
  container.innerHTML=`<div class="section-box"><h3>${isArabic?'توقعات كرة القدم':'Soccer Predictions'}</h3>
    <table><tr><th>Team A</th><th>Team B</th><th>Prediction</th></tr>
    <tr><td>Real Madrid</td><td>Barcelona</td><td>1-0</td></tr>
    <tr><td>Liverpool</td><td>Manchester City</td><td>2-2</td></tr>
    </table></div>`;
}

function loadLearn(container){
  container.innerHTML=`<div class="section-box"><h3>${isArabic?'تعلم / اتصل بنا':'Learn / Contact Us'}</h3>
    <p>${isArabic?'هنا بعض المعلومات عن شركة Global Trade...':'Here is some info about Global Trade Company...'}</p>
    <h4>${isArabic?'البنوك الليبية':'Libyan Banks We Deal With'}</h4>
    <ul>
      <li>Shemanda Frigia</li>
      <li>North African Bank</li>
    </ul>
    <h4>${isArabic?'الشهادات':'Testimonials'}</h4>
    <p>"Great platform for trading!"</p>
    <p>"Easy and fast to use."</p>
    <p>${isArabic?'للتواصل في ليبيا اتصل على':'Contact in Libya'}: +218 912 345 678</p>
    </div>`;
}
</script>
</body>
</html>

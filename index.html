<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global Trade</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#0a0f1c;
  color:white;
}
nav {
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  border-bottom:1px solid #1c2333;
}
.logo {color:#d4af37; font-size:20px; font-weight:bold;}
.lang {border:1px solid #d4af37; padding:6px 12px; cursor:pointer;}
.center{text-align:center; margin-top:80px;}
input {padding:12px; margin:8px; width:240px; background:#111827; border:1px solid #333; color:white;}
button {padding:12px 20px; margin:5px; background:#d4af37; border:none; cursor:pointer; font-weight:bold;}
.grid {display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding:40px;}
.card {background:#111827; padding:40px; border-radius:12px; text-align:center; transition:0.3s; cursor:pointer;}
.card:hover{background:#1c2333;}
.page {display:none;}
.active {display:block;}
video,audio {width:100%; margin-top:20px;}
</style>
</head>

<body>

<nav>
  <div class="logo">Global Trade</div>
  <div class="lang" onclick="toggleLang()">العربية</div>
</nav>

<!-- LOGIN PAGE -->
<div id="loginPage" class="center active">
  <h2 id="title">Login / Register</h2>
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
  <button onclick="register()">Register</button>
  <button onclick="guestLogin()">Guest</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="page">
  <div class="center">
    <h2 id="dashTitle">Dashboard</h2>
    <h3>$<span id="balance">0</span></h3>
  </div>
  <div class="grid">
    <div class="card" onclick="openPage('stocks')">Stocks</div>
    <div class="card" onclick="openPage('crypto')">Crypto</div>
    <div class="card" onclick="openPage('learn')">Learn</div>
    <div class="card">Gold / Oil</div>
    <div class="card">Send Money</div>
    <div class="card">Contact</div>
  </div>
</div>

<!-- STOCKS PAGE -->
<div id="stocks" class="page center">
<h2>Stocks</h2>
<p>Tesla</p>
<p>Apple</p>
<p>Amazon</p>
<button onclick="back()">Back</button>
</div>

<!-- CRYPTO PAGE -->
<div id="crypto" class="page center">
<h2>Crypto</h2>
<p>Bitcoin</p>
<p>Ethereum</p>
<button onclick="back()">Back</button>
</div>

<!-- LEARN PAGE -->
<div id="learn" class="page center">
<h2>Learn Trading</h2>
<video controls>
<source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
</video>
<audio controls>
<source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
</audio>
<button onclick="back()">Back</button>
</div>

<script>
let user = null;
let currentLang = "en";

/* LOGIN SYSTEM */
function login(){
  if(!user) user = {email:email.value || "guest@globaltrade.com", balance:0};
  showDashboard();
}
function guestLogin(){
  user = {email:"guest@globaltrade.com", balance:0};
  showDashboard();
}
function register(){
  alert("Registered (demo)");
}
function showDashboard(){
  document.getElementById("loginPage").classList.remove("active");
  document.getElementById("dashboard").classList.add("active");
  updateBalance();
}
function updateBalance(){
  document.getElementById("balance").innerText = user.balance;
}

/* NAVIGATION */
function openPage(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(page).classList.add('active');
}
function back(){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById("dashboard").classList.add('active');
}

/* LANGUAGE SWITCH */
function toggleLang(){
  if(currentLang==="en"){
    currentLang="ar";
    document.body.style.direction="rtl";
    document.getElementById("title").innerText="تسجيل الدخول / إنشاء حساب";
    document.getElementById("dashTitle").innerText="لوحة التحكم";
  }else{
    currentLang="en";
    document.body.style.direction="ltr";
    document.getElementById("title").innerText="Login / Register";
    document.getElementById("dashTitle").innerText="Dashboard";
  }
}
</script>

</body>
</html>

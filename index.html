<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Trade</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#04060c;
  color:#e5e7eb;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  padding:15px 25px;
  background:#0b0f1a;
  border-bottom:1px solid #1f2937;
}

.logo{
  color:#d4af37;
  font-weight:bold;
}

/* BUTTONS */
.btn{
  padding:12px 18px;
  margin:10px;
  border-radius:8px;
  border:1px solid #1f2937;
  background:#0f172a;
  color:#e5e7eb;
  cursor:pointer;
}
.btn:hover{
  border-color:#d4af37;
}

/* PAGES */
.page{display:none;padding:30px;}
.active{display:block}

/* GRID */
.grid{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

/* CARD */
.card{
  flex:1;
  min-width:280px;
  background:#0b0f1a;
  padding:20px;
  border-radius:10px;
  border:1px solid #1f2937;
}

/* STOCK LIST */
.stock-item{
  padding:10px;
  border-bottom:1px solid #1f2937;
  cursor:pointer;
}
.stock-item:hover{
  background:#111827;
}

/* LIVE DATA */
.data{
  margin-top:10px;
  padding:10px;
  background:#020617;
  border-radius:6px;
}

/* MEDIA */
video,audio{
  width:100%;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">Global Trade</div>

<select onchange="changeLang(this.value)">
<option value="en">English</option>
<option value="ar">العربية</option>
</select>
</div>

<!-- HOME -->
<div id="home" class="page active">
<h1 id="title">Dashboard</h1>

<button class="btn" onclick="go('stocks')">Stocks</button>
<button class="btn" onclick="go('crypto')">Crypto</button>
<button class="btn" onclick="go('learn')">Learn</button>

</div>

<!-- STOCK LIST -->
<div id="stocks" class="page">
<button class="btn" onclick="go('home')">← Back</button>

<h2 id="stocksTitle">Stocks List</h2>

<div class="card">
<div class="stock-item" onclick="openStock('AAPL')">Apple (AAPL)</div>
<div class="stock-item" onclick="openStock('TSLA')">Tesla (TSLA)</div>
<div class="stock-item" onclick="openStock('NVDA')">NVIDIA (NVDA)</div>
</div>

</div>

<!-- STOCK DETAILS -->
<div id="stockDetails" class="page">
<button class="btn" onclick="go('stocks')">← Back</button>

<h2 id="stockName"></h2>

<div class="card">
<div id="price" class="data"></div>
<div id="high" class="data"></div>
<div id="low" class="data"></div>
</div>

<button class="btn" onclick="toggleGraph()">Show Graph</button>

<div id="chartBox" style="display:none;height:400px;"></div>

</div>

<!-- CRYPTO -->
<div id="crypto" class="page">
<button class="btn" onclick="go('home')">← Back</button>

<h2>Crypto List</h2>

<div class="card">
<div class="stock-item" onclick="openStock('BTCUSDT')">Bitcoin</div>
<div class="stock-item" onclick="openStock('ETHUSDT')">Ethereum</div>
</div>

</div>

<!-- LEARN -->
<div id="learn" class="page">
<button class="btn" onclick="go('home')">← Back</button>

<h2 id="learnTitle">Learn Trading</h2>

<div class="grid">

<div class="card">
<h3>Video</h3>
<video controls>
<source src="https://www.w3schools.com/html/mov_bbb.mp4">
</video>
</div>

<div class="card">
<h3>Audio</h3>
<audio controls>
<source src="https://www.w3schools.com/html/horse.mp3">
</audio>
</div>

</div>

</div>

<script>

/* NAV */
function go(page){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'))
document.getElementById(page).classList.add('active')
}

/* STOCK OPEN */
function openStock(symbol){
go('stockDetails')

document.getElementById("stockName").innerText=symbol

let price=(100+Math.random()*200).toFixed(2)
let high=(price*1.05).toFixed(2)
let low=(price*0.95).toFixed(2)

document.getElementById("price").innerText="Price: "+price
document.getElementById("high").innerText="High: "+high
document.getElementById("low").innerText="Low: "+low

}

/* GRAPH TOGGLE */
let graphLoaded=false
function toggleGraph(){
let box=document.getElementById("chartBox")

if(box.style.display==="none"){
box.style.display="block"

if(!graphLoaded){
new TradingView.widget({
container_id:"chartBox",
autosize:true,
symbol:"NASDAQ:AAPL",
theme:"dark"
})
graphLoaded=true
}

}else{
box.style.display="none"
}
}

/* LANGUAGE FULL SWITCH */
function changeLang(lang){

if(lang==="ar"){
document.getElementById("title").innerText="لوحة التحكم"
document.getElementById("stocksTitle").innerText="قائمة الأسهم"
document.getElementById("learnTitle").innerText="تعلم التداول"
}else{
document.getElementById("title").innerText="Dashboard"
document.getElementById("stocksTitle").innerText="Stocks List"
document.getElementById("learnTitle").innerText="Learn Trading"
}

}

</script>

</body>
</html>

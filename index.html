<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Trade Capital Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
body {margin:0; font-family:'Segoe UI', sans-serif; background:#0a0f25; color:#fff;}
#loginPage {display:flex; justify-content:center; align-items:center; height:100vh; background:#0a0f25;}
#loginBox {background:rgba(255,255,255,0.05); backdrop-filter:blur(15px); padding:40px; border-radius:20px; width:350px; display:flex; flex-direction:column; align-items:center; gap:20px;}
#loginBox h2 {margin:0; font-size:28px; color:#ffd700;}
input {width:100%; padding:15px; border-radius:12px; border:none; font-size:16px; background:rgba(255,255,255,0.1); color:white;}
button {width:100%; padding:15px; border:none; border-radius:12px; font-size:16px; cursor:pointer; background:#ffd700; color:#0a0f25; font-weight:bold; transition:0.3s;}
button:hover {background:#ffc107;}
.lang-toggle-login {cursor:pointer; margin-top:10px; background:#1b1f3a; color:white; padding:10px 20px; border-radius:10px; font-weight:bold;}
header {display:none; background:#0b1d3a; color:white; padding:15px 30px; justify-content:space-between; align-items:center;}
header h1 {margin:0; font-size:26px; color:#ffd700;}
header .lang-toggle, header .back-dashboard {cursor:pointer; background:#ffd700; color:#0b1d3a; border-radius:8px; padding:6px 15px; font-weight:bold; margin-left:10px; transition:0.2s;}
header .lang-toggle:hover, header .back-dashboard:hover {background:#ffc107;}
main {display:none; flex-wrap:wrap; justify-content:center; padding:20px; gap:20px;}
.card {background:rgba(255,255,255,0.05); backdrop-filter:blur(8px); border-radius:15px; width:260px; height:150px; display:flex; justify-content:center; align-items:center; font-size:20px; font-weight:bold; text-align:center; box-shadow:0 6px 15px rgba(0,0,0,0.4); cursor:pointer; transition:transform 0.3s, box-shadow 0.3s;}
.card:hover {transform:translateY(-6px); box-shadow:0 10px 25px rgba(0,0,0,0.6);}
#sectionContent {margin:20px auto; width:95%; max-width:1200px; display:none;}
.section-card {background:rgba(255,255,255,0.05); backdrop-filter:blur(8px); border-radius:12px; padding:20px; margin:15px 0; box-shadow:0 5px 15px rgba(0,0,0,0.4);}
.section-card h3 {margin:0 0 10px 0; color:#ffd700;}
.section-data {margin-top:10px; font-size:16px;}
.bank-logos img, .soccer-logos img {max-width:60px; margin:5px;}
</style>
</head>
<body>

<div id="loginPage">
  <div id="loginBox">
    <h2 id="loginTitle">Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn" onclick="login()">Login</button>
    <button id="guestBtn" onclick="guestLogin()">Enter as Guest</button>
    <div class="lang-toggle-login" onclick="toggleLanguage()">عربي</div>
  </div>
</div>

<header>
  <h1>Global Trade Capital</h1>
  <div>
    <span class="lang-toggle" onclick="toggleLanguage()">عربي</span>
    <span class="back-dashboard" onclick="backToDashboard()">Back to Dashboard</span>
  </div>
</header>

<main>
  <div class="card" onclick="loadSection('stocks')">Stocks</div>
  <div class="card" onclick="loadSection('crypto')">Crypto</div>
  <div class="card" onclick="loadSection('fx')">FX</div>
  <div class="card" onclick="loadSection('commodities')">Gold & Oil</div>
  <div class="card" onclick="loadSection('soccer')">Soccer Predictions</div>
  <div class="card" onclick="loadSection('learn')">Learn / Contact Us</div>
</main>

<div id="sectionContent">
  <div id="stocksSection" class="section-card" style="display:none;"></div>
  <div id="cryptoSection" class="section-card" style="display:none;"></div>
  <div id="fxSection" class="section-card" style="display:none;"></div>
  <div id="commoditiesSection" class="section-card" style="display:none;"></div>
  <div id="soccerSection" class="section-card" style="display:none;"></div>
  <div id="learnSection" class="section-card" style="display:none;"></div>
</div>

<audio id="arabicAudio" controls style="display:none;">
  <source src="audio/global_trade_arabic.mp3" type="audio/mpeg">
</audio>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "7815da7ac2ab43ca8f4a4b73e10e",
  authDomain: "YOUR_FIREBASE_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_FIREBASE_PROJECT.firebaseio.com",
  projectId: "YOUR_FIREBASE_PROJECT",
  storageBucket: "YOUR_FIREBASE_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// Login functions
function login(){
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;
  auth.signInWithEmailAndPassword(email,password).then(()=>startApp()).catch(err=>alert(err.message));
}
function guestLogin(){
  auth.signInAnonymously().then(()=>startApp()).catch(err=>alert(err.message));
}

// App start
function startApp(){
  document.getElementById('loginPage').style.display='none';
  document.querySelector('header').style.display='flex';
  document.querySelector('main').style.display='flex';
  loadAllSections();
}

// Language toggle
let isArabic=false;
function toggleLanguage(){
  isArabic=!isArabic;
  document.body.dir=isArabic?'rtl':'ltr';
  document.querySelectorAll('.lang-toggle, .lang-toggle-login').forEach(el=>el.innerText=isArabic?'EN':'عربي');
  document.getElementById('loginTitle').innerText=isArabic?'تسجيل الدخول':'Login';
  document.getElementById('loginBtn').innerText=isArabic?'تسجيل الدخول':'Login';
  document.getElementById('guestBtn').innerText=isArabic?'الدخول كزائر':'Enter as Guest';
  document.querySelectorAll('.card').forEach((c,i)=>{
    const texts=[['Stocks','Crypto','FX','Gold & Oil','Soccer Predictions','Learn / Contact Us'],
                 ['الأسهم','العملات الرقمية','العملات الأجنبية','الذهب والنفط','توقعات كرة القدم','تعلم / اتصل بنا']];
    c.innerText=isArabic?texts[1][i]:texts[0][i];
  });
}

// Navigation
function backToDashboard(){
  document.getElementById('sectionContent').querySelectorAll('.section-card').forEach(sec=>sec.style.display='none');
  document.querySelector('main').style.display='flex';
}
function loadSection(name){
  document.querySelector('main').style.display='none';
  document.getElementById('sectionContent').querySelectorAll('.section-card').forEach(sec=>sec.style.display='none');
  document.getElementById(name+'Section').style.display='block';
}

// Load all sections
function loadAllSections(){
  // Stocks (dummy)
  document.getElementById('stocksSection').innerHTML='<h3>Stocks</h3><div class="section-data">AAPL, MSFT, GOOGL, TSLA...</div>';
  
  // Crypto (sample live-like)
  document.getElementById('cryptoSection').innerHTML='<h3>Crypto</h3><div class="section-data">BTC: $30,000 | ETH: $1,900 | USDT: $1</div>';
  
  // FX
  document.getElementById('fxSection').innerHTML='<h3>FX</h3><div class="section-data">USD/EUR: 0.93 | USD/LYD: 4.85 | USD/GBP: 0.80</div>';
  
  // Commodities
  document.getElementById('commoditiesSection').innerHTML='<h3>Gold & Oil</h3><div class="section-data">Gold: $2,000 | Oil: $85</div>';
  
  // Soccer Predictions
  document.getElementById('soccerSection').innerHTML=`
    <h3>Soccer Predictions</h3>
    <div class="soccer-logos">
      <img src="https://cdn-icons-png.flaticon.com/512/232/232069.png" alt="Team1">
      <img src="https://cdn-icons-png.flaticon.com/512/232/232070.png" alt="Team2">
    </div>
    <div class="section-data">Next games available. Contact +218 91 494 8944 for betting info.</div>`;
  
  // Learn / Contact Us
  document.getElementById('learnSection').innerHTML=`
    <h3>Learn / Contact Us</h3>
    <p>Libyan Banks: Olympian Bank, North African Bank (Masraf Shamal Afrika), Shemanda Frigia</p>
    <div class="bank-logos">
      <img src="https://via.placeholder.com/60x40?text=Olympian" alt="Olympian Bank">
      <img src="https://via.placeholder.com/60x40?text=Shamal+Afrika" alt="North African Bank">
    </div>
    <p>Contact us: +218 91 494 8944</p>
    <p>Services: send money worldwide, crypto, soccer predictions, financial services.</p>`;
}
</script>

</body>
</html>

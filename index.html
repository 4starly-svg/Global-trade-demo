<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL TRADE LTD | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --navy: #020617; --card: #0f172a; --emerald: #10b981; --red: #ef4444; }
        * { box-sizing: border-box; font-family: 'Noto Sans Arabic', sans-serif; transition: 0.3s; }
        
        body, html { height: 100%; margin: 0; background: var(--navy); color: white; overflow: hidden; display: flex; flex-direction: column; }

        /* THE ORIGINAL NAV BAR */
        nav {
            height: 90px; display: flex; align-items: center; justify-content: center;
            gap: 15px; background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--gold); padding: 0 20px;
        }
        .nav-btn {
            background: transparent; border: 1px solid #1e293b; color: #94a3b8;
            padding: 12px 25px; cursor: pointer; font-weight: 700; font-size: 14px; border-radius: 5px; text-transform: uppercase;
        }
        .nav-btn.active { color: var(--gold); border-color: var(--gold); background: rgba(212, 175, 55, 0.1); }

        /* MAIN CONTENT - CENTERED LIKE THE ORIGINAL */
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .view { display: none; width: 90%; max-width: 1100px; text-align: center; flex-direction: column; height: 100%; justify-content: center; }
        .view.active { display: flex; animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* THE ORIGINAL BIG TITLE */
        .big-title { font-family: 'Cinzel', serif; font-size: 45px; color: var(--gold); margin-bottom: 20px; letter-spacing: 2px; }
        
        /* SIDE-BY-SIDE PANELS (FOR TRADING) */
        .split-container { display: flex; gap: 20px; width: 100%; height: 500px; align-items: stretch; }
        .panel-card { background: var(--card); border: 1px solid #1e293b; border-radius: 15px; padding: 30px; flex: 1; display: flex; flex-direction: column; justify-content: center; }

        /* ORIGINAL GOLD BUTTONS */
        .btn-gold { background: var(--gold); color: black; border: none; padding: 18px 40px; font-weight: 900; cursor: pointer; border-radius: 8px; font-size: 18px; width: 100%; margin-top: 20px; }
        .btn-gold:hover { transform: scale(1.02); background: white; }

        /* INPUTS */
        .input-auth { width: 100%; padding: 15px; background: #000; border: 1px solid #1e293b; color: white; border-radius: 8px; text-align: center; font-size: 18px; margin-bottom: 10px; }

        /* TRUST LOGOS - THE ONES YOU NEED */
        .logo-row { display: flex; justify-content: center; align-items: center; gap: 30px; margin-top: 40px; filter: grayscale(1) brightness(2); opacity: 0.6; }
        .logo-row img { height: 25px; }
        .bank-labels { color: var(--gold); font-size: 12px; font-weight: 900; margin-top: 15px; letter-spacing: 1px; }
    </style>
</head>
<body>

<nav>
    <button class="nav-btn active" onclick="showTab('v-home', this)">المحفظة</button>
    <button class="nav-btn" onclick="showTab('v-trade', this)">التداول</button>
    <button class="nav-btn" onclick="showTab('v-fx', this)">صرف العملات</button>
    <button class="nav-btn" onclick="showTab('v-info', this)">تعلم واتصل</button>
</nav>

<main>
    <div id="v-home" class="view active">
        <h1 class="big-title">GLOBAL TRADE LTD</h1>
        <div class="panel-card" style="max-width: 600px; margin: 0 auto;">
            <p style="color:#94a3b8; font-weight: bold;">رصيدك المباشر</p>
            <div style="font-size: 70px; font-weight: 900; color: var(--emerald); margin: 10px 0;">$10,000.00</div>
            <button class="btn-gold" onclick="wa('Account_Fund')">إيداع / سحب أموال</button>
        </div>
        
        <div class="logo-row">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg">
        </div>
        <div class="bank-labels">CBL ● JUMHOURIA BANK ● SAHARA BANK</div>
    </div>

    <div id="v-trade" class="view">
        <h1 class="big-title">منصة التداول</h1>
        <div class="split-container">
            <div class="panel-card" style="flex: 2; padding: 0; overflow: hidden;">
                <iframe src="https://www.tradingview.com/widgetembed/?symbol=NASDAQ%3ATSLA&theme=dark&locale=ar" style="width:100%; height:100%; border:none;"></iframe>
            </div>
            <div class="panel-card">
                <h3 style="color:var(--gold)">تنفيذ فوري</h3>
                <input type="text" class="input-auth" id="t-sym" placeholder="رمز السهم (e.g. BTC)">
                <input type="number" class="input-auth" id="t-amt" placeholder="المبلغ المطلوب">
                <button class="btn-gold" style="background:var(--emerald); color:white;" onclick="order('شراء')">شراء / BUY</button>
                <button class="btn-gold" style="background:var(--red); color:white;" onclick="order('بيع')">بيع / SELL</button>
            </div>
        </div>
    </div>

    <div id="v-fx" class="view">
        <h1 class="big-title">تحويل العملات</h1>
        <div class="panel-card" style="max-width: 500px; margin: 0 auto;">
            <p>سعر الصرف: 7.34 LYD</p>
            <input type="number" id="fx-in" class="input-auth" placeholder="المبلغ بالدولار USD" oninput="calcFX()">
            <div id="fx-out" style="font-size: 40px; font-weight: 900; color: var(--gold); margin: 20px 0;">0.00 LYD</div>
            <button class="btn-gold" onclick="wa('Exchange_Request')">تأكيد عملية الصرف</button>
        </div>
    </div>

    <div id="v-info" class="view">
        <h1 class="big-title">مركز الاتصال</h1>
        <div class="panel-card" style="max-width: 600px; margin: 0 auto;">
            <button class="btn-gold" style="background:white; color:black;" onclick="playAudio()">تشغيل الإيجاز الصوتي 🎙️</button>
            <h2 style="margin-top: 30px;">+218 91 570 9015</h2>
            <p style="color:#94a3b8;">تواصل مباشرة مع المدير التنفيذي عبر واتساب</p>
            <button class="btn-gold" onclick="wa('General_Inquiry')">ابدأ المحادثة الآن</button>
        </div>
    </div>
</main>

<script>
    function showTab(tabId, btn) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    function calcFX() {
        const val = document.getElementById('fx-in').value;
        document.getElementById('fx-out').innerText = (val * 7.34).toFixed(2) + " LYD";
    }

    function order(type) {
        const s = document.getElementById('t-sym').value;
        const a = document.getElementById('t-amt').value;
        if(!s || !a) return alert("يرجى إكمال البيانات");
        window.location.href = `https://wa.me/218915709015?text=طلب_${type}_${a}_من_${s}`;
    }

    function wa(msg) {
        window.location.href = `https://wa.me/218915709015?text=GlobalTrade_${msg}`;
    }

    function playAudio() {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance("مرحباً بكم في جلوبال تريد ليميتد. نحن وجهتكم الأولى والآمنة للتمويل والتحويل الدولي. معنا، يمكنك إرسال واستلام الأموال في جميع أنحاء العالم بكل سهولة وثقة. ثقتكم هي رأس مالنا.");
        msg.lang = 'ar-SA';
        msg.rate = 0.85;
        window.speechSynthesis.speak(msg);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Trade Capital - Live Trading & Soccer Predictions</title>
<style>
body { margin:0; font-family:'Segoe UI',sans-serif; background:#0a0a0a; color:#fff; display:flex; flex-direction:column; align-items:center; }
header { width:100%; padding:15px; background:linear-gradient(90deg,#0d0d0d,#1a1a1a); display:flex; justify-content:space-between; align-items:center; }
header h1 { color:#FFD700; text-shadow:0 0 8px #FFD700; display:flex; align-items:center; gap:10px; }
header h1 img { width:50px; }
.lang-toggle { cursor:pointer; padding:5px 10px; border:1px solid #fff; border-radius:5px; }
.what-we-do { width:90%; max-width:900px; text-align:center; margin-top:10px; font-size:18px; color:#00ffcc; }
.dashboard, #subFolderContainer, #itemContainer { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; margin-top:20px; width:90%; }
.folder, .subFolder, .itemCard { background:linear-gradient(145deg,#1a1a1a,#333); padding:20px; border-radius:15px; width:220px; text-align:center; box-shadow:0 0 20px #00ffcc; cursor:pointer; transition: transform 0.3s, box-shadow 0.3s; }
.folder:hover, .subFolder:hover, .itemCard:hover { transform:translateY(-5px); box-shadow:0 0 25px #FFD700; }
.backBtn { margin-top:15px; background:#FFD700; color:#000; cursor:pointer; padding:10px 15px; border-radius:8px; border:none; }
.wallet { margin-top:15px; color:#FFD700; font-weight:bold; font-size:18px; }
#loginModal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); display:flex; align-items:center; justify-content:center; z-index:100; }
#loginContent { background:#111; padding:30px; border-radius:15px; text-align:center; width:320px; box-shadow:0 0 20px #00ffcc; }
#loginContent input { width:85%; padding:10px; margin:10px 0; border-radius:5px; border:none; }
button { background:#00ffcc; border:none; padding:10px 20px; margin:5px; border-radius:8px; font-weight:bold; color:#000; cursor:pointer; transition:0.3s; }
button:hover { background:#FFD700; color:#000; }
.contact { margin-top:40px; text-align:center; color:#00ffcc; }
.contact img { width:80px; margin-bottom:10px; }
.contact a { display:block; color:#FFD700; margin:5px 0; text-decoration:none; }
.price-card { background:#111; padding:15px; border-radius:10px; margin:10px; box-shadow:0 0 15px #00ffcc; }
</style>
</head>
<body>

<header>
  <h1><img src="https://i.imgur.com/YOUR_LOGO.png" alt="Logo">Global Trade Capital</h1>
  <div class="lang-toggle" id="langToggle">العربية</div>
</header>

<div class="what-we-do" id="whatWeDo">
  We provide global trading solutions for stocks, crypto, commodities, and now live soccer predictions with USDT betting.
</div>

<div class="wallet" id="walletDisplay" style="display:none;"></div>

<!-- LOGIN -->
<div id="loginModal">
  <div id="loginContent">
    <h2 id="loginTitle">Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login as Guest</button>
  </div>
</div>

<!-- MAIN DASHBOARD FOLDERS -->
<div class="dashboard" id="folders" style="display:none;">
  <div class="folder" onclick="openSubFolder('stocks')">Stocks</div>
  <div class="folder" onclick="openSubFolder('crypto')">Crypto</div>
  <div class="folder" onclick="openSubFolder('commodities')">Gold / Oil</div>
  <div class="folder" onclick="openSubFolder('learn')">Learn / Contact</div>
  <div class="folder" onclick="openSubFolder('sendMoney')">Send Money Worldwide</div>
  <div class="folder" onclick="openSubFolder('soccer')">Soccer</div>
</div>

<!-- SUBFOLDERS -->
<div id="subFolderContainer" style="display:none; flex-direction:column;">
  <button class="backBtn" onclick="backToMainFolders()">Back</button>
  <div id="subFolders" style="display:flex; flex-wrap:wrap; justify-content:center; gap:15px;"></div>
</div>

<!-- ITEMS -->
<div id="itemContainer" style="display:none; flex-direction:column;">
  <button class="backBtn" onclick="backToSubFolders()">Back</button>
  <div id="items" style="display:flex; flex-wrap:wrap; justify-content:center; gap:15px;"></div>
</div>

<script>
// --- STATE ---
let arabic=false;
let currentUser=null;

// --- SAMPLE DATA ---
let guestWallet = 1000;
const subFoldersData = {
  stocks: ['Trending','52-Week Highs','52-Week Lows','Top Movers'],
  crypto: ['Trending','Top Coins','Stable Coins'],
  commodities: ['Gold','Oil'],
  learn: ['Contact','FAQ','Tutorials'],
  sendMoney: ['Stocks','Crypto','Learn/Contact'],
  soccer: ['Premier League','La Liga','Serie A','Bundesliga']
};

const itemsData = {
  'Trending':['AAPL','TSLA','BTC'],
  '52-Week Highs':['AAPL','MSFT','GOOG'],
  '52-Week Lows':['AMD','BABA','INTC'],
  'Top Movers':['TSLA','NVDA','META'],
  'Top Coins':['ETH','BNB','ADA'],
  'Stable Coins':['USDT','USDC'],
  'Gold':['Gold Price'],
  'Oil':['Oil Price'],
  'Contact':['Phone: +218XXXXXXXX','Email: support@globaltrade.com','Twitter: @globaltrade'],
  'FAQ':['How to trade','Fees','Support'],
  'Tutorials':['Video 1','Video 2'],
  'Stocks':['AAPL','TSLA','MSFT'], 
  'Crypto':['BTC','ETH','USDT'],
  'Learn/Contact':['Contact','FAQ','Tutorials'],
  'Premier League':[ {match:'Manchester United vs Chelsea', date:'2026-03-25 18:00', price:10},
                     {match:'Liverpool vs Arsenal', date:'2026-03-26 20:00', price:12}],
  'La Liga':[ {match:'Real Madrid vs Barcelona', date:'2026-03-25 19:00', price:10},
              {match:'Atletico Madrid vs Sevilla', date:'2026-03-26 21:00', price:11}],
  'Serie A':[ {match:'Juventus vs Inter', date:'2026-03-25 17:00', price:10},
              {match:'AC Milan vs Napoli', date:'2026-03-26 19:00', price:12}],
  'Bundesliga':[ {match:'Bayern vs Dortmund', date:'2026-03-25 18:00', price:10},
                 {match:'Leipzig vs Gladbach', date:'2026-03-26 20:00', price:11}]
};

// --- LOGIN ---
document.getElementById('loginBtn').onclick=()=>{
  currentUser={wallet:guestWallet};
  document.getElementById('loginModal').style.display='none';
  document.getElementById('folders').style.display='flex';
  document.getElementById('walletDisplay').style.display='block';
  document.getElementById('walletDisplay').innerText=`USDT Balance: ${currentUser.wallet}`;
};

// --- FOLDER NAVIGATION ---
let currentFolder='';
function openSubFolder(folder){
  currentFolder=folder;
  document.getElementById('folders').style.display='none';
  const subFolderDiv=document.getElementById('subFolders');
  subFolderDiv.innerHTML='';
  const list=subFoldersData[folder]||[];
  list.forEach(name=>{
    const div=document.createElement('div');
    div.className='subFolder';
    div.innerText=typeof name==='string'?name:name.name;
    div.onclick=()=>openItems(name);
    subFolderDiv.appendChild(div);
  });
  document.getElementById('subFolderContainer').style.display='flex';
}
function backToMainFolders(){document.getElementById('subFolderContainer').style.display='none'; document.getElementById('folders').style.display='flex';}
function openItems(subFolder){
  document.getElementById('subFolderContainer').style.display='none';
  const itemsDiv=document.getElementById('items');
  itemsDiv.innerHTML='';
  const list=itemsData[subFolder]||[];
  list.forEach(item=>{
    const div=document.createElement('div');
    div.className='itemCard';
    if(subFolder==='Premier League' || subFolder==='La Liga' || subFolder==='Serie A' || subFolder==='Bundesliga'){
      div.innerHTML=`${item.match}<br>${item.date}<br>Bet: ${item.price} USDT<br><button onclick="placeBet('${item.match}',${item.price})">Place Bet</button>`;
    } else {
      div.innerText=typeof item==='string'?item:item.match;
    }
    itemsDiv.appendChild(div);
  });
  document.getElementById('itemContainer').style.display='flex';
}
function backToSubFolders(){document.getElementById('itemContainer').style.display='none'; openSubFolder(currentFolder);}

// --- PLACE BET FUNCTION ---
function placeBet(match, amount){
  if(currentUser.wallet>=amount){
    currentUser.wallet-=amount;
    document.getElementById('walletDisplay').innerText=`USDT Balance: ${currentUser.wallet}`;
    alert(`Bet placed on ${match} for ${amount} USDT!`);
    // Here we can add API call to log bet for real-money backend
  } else { alert('Insufficient USDT balance!'); }
}

// --- LANGUAGE TOGGLE ---
document.getElementById('langToggle').onclick=()=>{
  arabic=!arabic;
  const folders=document.getElementById('folders').children;
  if(arabic){
    document.getElementById('loginTitle').innerText='تسجيل الدخول';
    document.getElementById('username').placeholder='اسم المستخدم';
    document.getElementById('password').placeholder='كلمة المرور';
    document.getElementById('loginBtn').innerText='تسجيل كزائر';
    folders[0].innerText='الأسهم';
    folders[1].innerText='كريبتو';
    folders[2].innerText='ذهب / نفط';
    folders[3].innerText='تعلم / اتصل';
    folders[4].innerText='أرسل الأموال عالمياً';
    folders[5].innerText='كرة القدم';
    document.getElementById('whatWeDo').innerText='نوفر حلول تداول عالمية للأسهم والعملات المشفرة والسلع والآن توقعات كرة القدم مع رهان USDT.';
    document.getElementById('walletDisplay').innerText=`رصيد USDT: ${currentUser?currentUser.wallet:0}`;
    document.getElementById('langToggle').innerText='English';
  } else {
    document.getElementById('loginTitle').innerText='Login';
    document.getElementById('username').placeholder='Username';
    document.getElementById('password').placeholder='Password';
    document.getElementById('loginBtn').innerText='Login as Guest';
    folders[0].innerText='Stocks';
    folders[1].innerText='Crypto';
    folders[2].innerText='Gold / Oil';
    folders[3].innerText='Learn / Contact';
    folders[4].innerText='Send Money Worldwide';
    folders[5].innerText='Soccer';
    document.getElementById('whatWeDo').innerText='We provide global trading solutions for stocks, crypto, commodities, and now live soccer predictions with USDT betting.';
    document.getElementById('walletDisplay').innerText=`USDT Balance: ${currentUser?currentUser.wallet:0}`;
    document.getElementById('langToggle').innerText='العربية';
  }
};

// --- API PLACEHOLDERS ---
function fetchGoldPrice(div){ div.innerText='Gold Price: $' + (1900+Math.random()*50).toFixed(2); }
function fetchOilPrice(div){ div.innerText='Oil Price: $' + (80+Math.random()*10).toFixed(2); }
function fetchUSDTBalance(div){ div.innerText='USDT Balance: ' + (currentUser?currentUser.wallet:0); }
function fetchMarketData(div,symbol){ div.innerText=`${symbol}: $${(Math.random()*300+50).toFixed(2)}`; }

// --- BANK AND WALLET PLACEHOLDERS ---
function depositToLibyaBank(amount){ console.log(`Deposit ${amount} LYD placeholder`); }
function withdrawFromLibyaBank(amount){ console.log(`Withdraw ${amount} LYD placeholder`); }
function sendUSDT(toUser, amount){ console.log(`Send ${amount} USDT to ${toUser} placeholder`); }

</script>
</body>
</html>

<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Trade Capital Dashboard 2050</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
body {margin:0; font-family:'Segoe UI', sans-serif; background:#0a1128; color:#f0f0f0;}
#loginPage {display:flex; justify-content:center; align-items:center; height:100vh;}
#loginBox {background:rgba(255,255,255,0.05); backdrop-filter:blur(15px); padding:50px; border-radius:25px; width:400px; display:flex; flex-direction:column; align-items:center; gap:25px; box-shadow:0 15px 35px rgba(0,0,0,0.5);}
#loginBox h2 {margin:0; font-size:32px; display:flex; align-items:center; gap:15px; color:#ffcb77;}
input {width:100%; padding:18px; border-radius:12px; border:none; font-size:18px; background:rgba(255,255,255,0.1); color:white;}
button {width:100%; padding:18px; border:none; border-radius:12px; font-size:18px; cursor:pointer; background:#ff9f1c; color:#1c1c1c; font-weight:bold; transition:0.3s;}
button:hover {background:#ffc16a;}
.lang-toggle-login {cursor:pointer; margin-top:10px; background:#1b2a48; color:white; padding:12px 20px; border-radius:10px; font-weight:bold;}
header {display:none; background:#0b1d3a; color:white; padding:20px 40px; justify-content:space-between; align-items:center;}
header h1 {margin:0; display:flex; align-items:center; gap:15px; font-size:32px; color:#ffcb77;}
header .lang-toggle, header .back-dashboard {cursor:pointer; background:#ffcb77; color:#0b1d3a; border-radius:8px; padding:8px 15px; font-weight:bold; margin-left:10px; transition:0.2s;}
header .lang-toggle:hover, header .back-dashboard:hover {background:#ffd786;}
main {display:none; flex-wrap:wrap; justify-content:center; padding:30px; gap:25px;}
.card {background:rgba(255,255,255,0.05); backdrop-filter:blur(10px); border-radius:20px; width:280px; height:180px; display:flex; flex-direction:column; justify-content:center; align-items:center; box-shadow:0 6px 20px rgba(0,0,0,0.4); cursor:pointer; transition:transform 0.3s, box-shadow 0.3s;}
.card:hover {transform:translateY(-10px) scale(1.05); box-shadow:0 10px 30px rgba(0,0,0,0.6);}
.card img {max-width:70px; margin-bottom:12px;}
.card h2 {margin:0; font-size:20px; text-align:center;}
#sectionContent {margin:25px auto; width:95%; max-width:1280px; display:none;}
.section-card {background:rgba(255,255,255,0.05); backdrop-filter:blur(10px); border-radius:15px; padding:20px; margin:15px 0; box-shadow:0 5px 15px rgba(0,0,0,0.4);}
.section-card img {max-width:50px; margin-right:15px; vertical-align:middle;}
.section-card h3 {margin:0 0 10px 0;}
.section-data {margin-top:10px; font-size:16px;}
.payment-btn {margin-top:10px; padding:10px 20px; border:none; border-radius:10px; font-weight:bold; cursor:pointer;}
.usdt-btn {background:#26a17b; color:white;}
.paypal-btn {background:#003087; color:white;}
.cashagent-btn {background:#f9a825; color:black;}
</style>
</head>
<body><div id="loginPage">
  <div id="loginBox">
    <h2 id="loginTitle"><img src="https://i.ibb.co/2s4Wp2v/global-trade-logo.png" alt="Logo" style="width:75px; vertical-align:middle;"> Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn" onclick="login()">Login</button>
    <button id="guestBtn" onclick="guestLogin()">Enter as Guest</button>
    <div class="lang-toggle-login" onclick="toggleLanguage()">عربي</div>
  </div>
</div><header>
  <h1><img src="https://i.ibb.co/2s4Wp2v/global-trade-logo.png" alt="Logo" style="width:65px;"> Global Trade Capital</h1>
  <div>
    <span class="lang-toggle" onclick="toggleLanguage()">عربي</span>
    <span class="back-dashboard" onclick="backToDashboard()">Back to Dashboard</span>
  </div>
</header><main>
  <div class="card" onclick="loadSection('stocks')">
    <h2>Stocks</h2>
  </div>
  <div class="card" onclick="loadSection('crypto')">
    <img src="https://cdn-icons-png.flaticon.com/512/825/825623.png" alt="Crypto">
    <h2>Crypto</h2>
  </div>
  <div class="card" onclick="loadSection('fx')">
    <img src="https://cdn-icons-png.flaticon.com/512/188/188943.png" alt="FX">
    <h2>FX</h2>
  </div>
  <div class="card" onclick="loadSection('commodities')">
    <img src="https://cdn-icons-png.flaticon.com/512/3222/3222932.png" alt="Gold & Oil">
    <h2>Gold & Oil</h2>
  </div>
  <div class="card" onclick="loadSection('soccer')">
    <img src="https://cdn-icons-png.flaticon.com/512/232/232069.png" alt="Soccer">
    <h2>Soccer Predictions</h2>
  </div>
  <div class="card" onclick="loadSection('learn')">
    <img src="https://cdn-icons-png.flaticon.com/512/1250/1250615.png" alt="Learn">
    <h2>Learn / Contact Us</h2>
  </div>
</main><div id="sectionContent">
  <div id="stocksSection" class="section-card" style="display:none;"></div>
  <div id="cryptoSection" class="section-card" style="display:none;"></div>
  <div id="fxSection" class="section-card" style="display:none;"></div>
  <div id="commoditiesSection" class="section-card" style="display:none;"></div>
  <div id="soccerSection" class="section-card" style="display:none;"></div>
  <div id="learnSection" class="section-card" style="display:none;"></div>
</div><script>
// Guest login only (no Firebase)
function login(){startApp();}
function guestLogin(){startApp();}
function startApp(){
  document.getElementById('loginPage').style.display='none';
  document.querySelector('header').style.display='flex';
  document.querySelector('main').style.display='flex';
  loadAllSections();
}

let isArabic=false;
function toggleLanguage(){
  isArabic=!isArabic;
  document.body.dir=isArabic?'rtl':'ltr';
  document.querySelectorAll('.lang-toggle, .lang-toggle-login').forEach(el=>el.innerText=isArabic?'EN':'عربي');
  document.getElementById('loginTitle').innerHTML=`<img src='https://i.ibb.co/2s4Wp2v/global-trade-logo.png' style='width:75px; vertical-align:middle;'> ${isArabic?'تسجيل الدخول':'Login'}`;
  document.getElementById('loginBtn').innerText=isArabic?'تسجيل الدخول':'Login';
  document.getElementById('guestBtn').innerText=isArabic?'الدخول كزائر':'Enter as Guest';
  document.querySelectorAll('.card h2').forEach((h2,i)=>{
    const texts=[['Stocks','Crypto','FX','Gold & Oil','Soccer Predictions','Learn / Contact Us'],['الأسهم','العملات الرقمية','العملات الأجنبية','الذهب والنفط','توقعات كرة القدم','تعلم / اتصل بنا']];
    h2.innerText=isArabic?texts[1][i]:texts[0][i];
  });
}

function backToDashboard(){
  document.getElementById('sectionContent').querySelectorAll('.section-card').forEach(sec=>sec.style.display='none');
  document.querySelector('main').style.display='flex';
}

function loadSection(name){
  document.querySelector('main').style.display='none';
  document.getElementById('sectionContent').querySelectorAll('.section-card').forEach(sec=>sec.style.display='none');
  document.getElementById(name+'Section').style.display='block';
}

function loadAllSections(){
  document.getElementById('stocksSection').innerHTML='<h3>Stocks</h3><div class="section-data">Dummy stocks data (no images)</div>';
  document.getElementById('cryptoSection').innerHTML='<h3>Crypto</h3><div class="section-data">Live crypto data here...</div>';
  document.getElementById('fxSection').innerHTML='<h3>FX</h3><div class="section-data">Live FX rates here...</div>';
  document.getElementById('commoditiesSection').innerHTML='<h3>Gold & Oil</h3><div class="section-data">Live commodity prices here...</div>';
  document.getElementById('soccerSection').innerHTML='<h3>Soccer Predictions</h3><div class="section-data">Upcoming games, team logos, odds, and prediction buttons. For info call +218914948944</div>';
  document.getElementById('learnSection').innerHTML='<h3>Learn / Contact Us</h3><p>Global Trade: Send money, buy crypto, predictions, P2P services.</p><p>Contact: +218914948944</p>';
}
</script></body>
</html>

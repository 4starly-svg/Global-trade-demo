<!DOCTYPE html>
<html lang="ar" dir="rtl" id="root-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GT LTD | NEON TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #030712; --glass: rgba(15, 23, 42, 0.8); --border: rgba(0, 242, 255, 0.2); }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        body, html { height: 100%; margin: 0; background: var(--bg); color: #f8fafc; overflow: hidden; }

        /* HIGH-TECH BACKGROUND */
        body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, #0c4a6e 0%, #030712 100%); z-index: -1; }

        /* LANG SWITCHER - SLEEK TOP */
        .top-bar { height: 50px; background: rgba(0,0,0,0.5); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; border-bottom: 1px solid var(--border); }
        .lang-toggle { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 5px 15px; border-radius: 4px; font-size: 11px; font-weight: 900; cursor: pointer; letter-spacing: 1px; }

        /* LOGIN SCREEN - CYBER BOX */
        #login-screen { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 9999; background: var(--bg); }
        .cyber-box { background: var(--glass); border: 1px solid var(--neon); padding: 50px; border-radius: 2px; width: 400px; text-align: center; box-shadow: 0 0 50px rgba(0, 242, 255, 0.1); clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%); }
        .cyber-box h1 { font-family: 'Orbitron', sans-serif; color: var(--neon); letter-spacing: 4px; margin-bottom: 30px; }

        /* INPUTS - MINIMALIST */
        .input-tech { width: 100%; background: rgba(0,0,0,0.5); border: none; border-bottom: 2px solid #1e293b; padding: 15px; color: white; font-size: 16px; margin-bottom: 20px; outline: none; }
        .input-tech:focus { border-bottom-color: var(--neon); }
        .btn-neon { background: var(--neon); color: black; border: none; padding: 15px; width: 100%; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }

        /* DASHBOARD GRID */
        #main-app { display: none; height: calc(100vh - 50px); grid-template-columns: 280px 1fr; }
        
        /* SIDEBAR NAVIGATION */
        aside { background: rgba(0,0,0,0.4); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 30px; gap: 20px; }
        .nav-item { padding: 15px; color: #94a3b8; font-weight: 700; cursor: pointer; font-size: 13px; border-right: 3px solid transparent; }
        .nav-item.active { color: var(--neon); border-right-color: var(--neon); background: linear-gradient(to left, rgba(0, 242, 255, 0.05), transparent); }

        /* VIEWPORT */
        .viewport { padding: 40px; display: flex; align-items: center; justify-content: center; }
        .view { display: none; width: 100%; height: 100%; grid-template-columns: 1fr 1fr; gap: 30px; align-items: center; }
        .view.active { display: grid; animation: slideIn 0.5s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        /* COMPONENTS */
        .data-card { background: var(--glass); border: 1px solid var(--border); padding: 40px; border-radius: 10px; position: relative; }
        .bal-title { color: var(--neon); font-size: 12px; font-weight: 900; letter-spacing: 2px; }
        .bal-val { font-size: 60px; font-weight: 900; font-family: 'Orbitron', sans-serif; margin: 15px 0; }
        
        iframe { border-radius: 8px; border: 1px solid var(--border); width: 100%; height: 500px; }

        /* TRUST LOGOS - SMALL & CLEAN */
        .logos { display: flex; gap: 20px; margin-top: 30px; opacity: 0.3; filter: grayscale(1); }
        .logos img { height: 20px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div style="font-family:'Orbitron'; color:var(--neon); font-size:14px;">SYSTEM STATUS: ONLINE</div>
        <button class="lang-toggle" onclick="toggleLang()" id="lang-btn">ENGLISH MODE</button>
    </div>

    <div id="login-screen">
        <div class="cyber-box">
            <h1>GT TERMINAL</h1>
            <input type="text" id="uid" class="input-tech" placeholder="ACCESS ID / المعرف">
            <input type="password" id="pass" class="input-tech" placeholder="PASSPHRASE / كلمة المرور">
            <button class="btn-neon" onclick="launch()">INITIALIZE</button>
        </div>
    </div>

    <div id="main-app">
        <aside>
            <div style="font-family:'Orbitron'; font-size:18px; color:var(--neon); margin-bottom:40px;">GLOBAL TRADE</div>
            <div class="nav-item active" onclick="tab('v-home', this)" id="n1">DASHBOARD / اللوحة</div>
            <div class="nav-item" onclick="tab('v-stocks', this)" id="n2">MARKETS / الأسواق</div>
            <div class="nav-item" onclick="tab('v-swap', this)" id="n3">EXCHANGE / الصرف</div>
            <div class="nav-item" onclick="tab('v-hq', this)" id="n4">HQ / المقر</div>
        </aside>

        <section class="viewport">
            <div id="v-home" class="view active">
                <div class="data-card">
                    <div class="bal-title">TOTAL EQUITY / إجمالي الأصول</div>
                    <div class="bal-val" id="disp-bal">$10,000.00</div>
                    <button class="btn-neon" onclick="window.location.href='https://wa.me/218915709015'">TRANSFER FUNDS</button>
                    <div class="logos">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg">
                        <span style="font-size:10px; color:white;">CBL | JUMHOURIA</span>
                    </div>
                </div>
                <iframe src="https://www.tradingview.com/widgetembed/?symbol=NASDAQ%3ATSLA&theme=dark&locale=en"></iframe>
            </div>

            <div id="v-stocks" class="view" style="grid-template-columns: 1fr;">
                <iframe src="https://www.tradingview.com/widgetembed/?symbol=BITSTAMP%3ABTCUSD&theme=dark&locale=en"></iframe>
            </div>

            <div id="v-swap" class="view" style="grid-template-columns: 1fr;">
                <div class="data-card" style="max-width:500px; margin:auto;">
                    <div class="bal-title">USD TO LYD SWAP</div>
                    <input type="number" id="in-val" class="input-tech" placeholder="0.00 USD" oninput="convert()">
                    <div id="out-val" style="font-size:32px; font-weight:900; color:var(--neon); margin:20px 0;">0.00 LYD</div>
                    <button class="btn-neon" onclick="window.location.href='https://wa.me/218915709015'">CONFIRM SWAP</button>
                </div>
            </div>

            <div id="v-hq" class="view">
                <div class="data-card">
                    <div class="bal-title">AUDIO BRIEFING</div>
                    <button class="btn-neon" style="background:transparent; border:1px solid var(--neon); color:var(--neon); margin-top:20px;" onclick="playBriefing()">PLAY SYSTEM BRIEF</button>
                    <p style="margin-top:30px; font-size:12px; color:#94a3b8;">SUPPORT: +218 91 570 9015</p>
                </div>
                <div class="data-card" style="border-color: #ef4444;">
                    <div class="bal-title" style="color:#ef4444;">WITHDRAWAL</div>
                    <input type="number" class="input-tech" placeholder="AMOUNT">
                    <button class="btn-neon" style="background:#ef4444;">REQUEST Payout</button>
                </div>
            </div>
        </section>
    </div>

<script>
    function launch() {
        const id = document.getElementById('uid').value;
        if(id) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'grid';
        }
    }

    function tab(id, el) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    function toggleLang() {
        const r = document.getElementById('root-tag');
        const isAr = r.dir === "rtl";
        r.dir = isAr ? 'ltr' : 'rtl';
        document.getElementById('lang-btn').innerText = isAr ? 'عربي' : 'ENGLISH MODE';
    }

    function convert() {
        const v = document.getElementById('in-val').value;
        document.getElementById('out-val').innerText = (v * 7.34).toFixed(2) + " LYD";
    }

    function playBriefing() {
        const msg = "مرحباً بكم في جلوبال تريد ليميتد. نحن نوفر أحدث تقنيات التداول والسيولة العالمية بين يديك.";
        const s = new SpeechSynthesisUtterance(msg);
        s.lang = 'ar-SA';
        window.speechSynthesis.speak(s);
    }
</script>
</body>
</html>

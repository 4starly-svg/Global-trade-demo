<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Trade</title>

<style>

/* ===== PREMIUM BANK STYLE ===== */
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#0b1c2c;
    color:#e6edf3;
}

/* ===== LOGIN ===== */
#loginPage {
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.login-box {
    background:#102a43;
    padding:40px;
    border-radius:12px;
    width:320px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

input {
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:6px;
}

/* BUTTONS */
button {
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.primary { background:#c9a227; color:black; }
.secondary { background:#334e68; color:white; }

/* LANGUAGE */
.lang {
    position:absolute;
    top:15px;
    right:20px;
    cursor:pointer;
}

/* ===== DASHBOARD ===== */
#dashboard {
    display:none;
    padding:20px;
}

.grid {
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:20px;
    margin-top:40px;
}

.card {
    background:#102a43;
    padding:30px;
    text-align:center;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}

.card:hover {
    background:#1c3d5a;
}

/* ===== SUB PAGES ===== */
.section {
    display:none;
    text-align:center;
}

.list-item {
    padding:15px;
    margin:10px auto;
    width:300px;
    background:#102a43;
    border-radius:8px;
    cursor:pointer;
}

</style>
</head>

<body>

<!-- 🌍 LANGUAGE -->
<div class="lang" onclick="toggleLang()">EN / AR</div>

<!-- 🔐 LOGIN -->
<div id="loginPage">
    <div class="login-box">
        <h2 id="title">Global Trade</h2>

        <input id="email" placeholder="Email">
        <input id="password" placeholder="Password" type="password">

        <button class="primary" onclick="login()" id="loginBtn">Login</button>
        <button class="secondary" onclick="guest()" id="guestBtn">Enter as Guest</button>
    </div>
</div>

<!-- 📊 DASHBOARD -->
<div id="dashboard">

<h2 style="text-align:center;" id="dashboardTitle">Dashboard</h2>

<div class="grid">
    <div class="card" onclick="openSection('stocks')">Stocks</div>
    <div class="card" onclick="openSection('crypto')">Crypto</div>
    <div class="card" onclick="openSection('fx')">FX</div>
    <div class="card" onclick="openSection('gold')">Gold & Oil</div>
    <div class="card" onclick="openSection('learn')">Learn</div>
</div>

</div>

<!-- 📈 STOCKS LIST -->
<div id="stocks" class="section">
    <h2>Stocks</h2>

    <div class="list-item" onclick="openStock('TSLA')">Tesla</div>
    <div class="list-item" onclick="openStock('NVDA')">NVIDIA</div>
    <div class="list-item" onclick="openStock('AMD')">AMD</div>

    <button onclick="back()">Back</button>
</div>

<!-- 📊 STOCK DETAILS -->
<div id="stockDetails" class="section">
    <h2 id="stockName"></h2>

    <p>High: ---</p>
    <p>Low: ---</p>
    <p>Open: ---</p>

    <button onclick="openChart()">View Chart</button>
    <button onclick="backToStocks()">Back</button>
</div>

<!-- 📉 CHART PAGE -->
<div id="chartPage" class="section">
    <h2>Chart</h2>

    <iframe id="chartFrame" width="90%" height="400"></iframe>

    <button onclick="backToDetails()">Back</button>
</div>

<script>

/* ===== LOGIN ===== */
function login(){
    document.getElementById("loginPage").style.display="none";
    document.getElementById("dashboard").style.display="block";
}

function guest(){
    localStorage.setItem("guest",true);
    login();
}

/* ===== NAVIGATION ===== */
function openSection(sec){
    document.getElementById("dashboard").style.display="none";
    document.getElementById(sec).style.display="block";
}

function back(){
    document.querySelectorAll(".section").forEach(s=>s.style.display="none");
    document.getElementById("dashboard").style.display="block";
}

/* ===== STOCK FLOW ===== */
let currentStock="";

function openStock(symbol){
    currentStock = symbol;
    document.getElementById("stocks").style.display="none";
    document.getElementById("stockDetails").style.display="block";
    document.getElementById("stockName").innerText = symbol;
}

function openChart(){
    document.getElementById("stockDetails").style.display="none";
    document.getElementById("chartPage").style.display="block";

    document.getElementById("chartFrame").src =
    "https://s.tradingview.com/widgetembed/?symbol=" + currentStock;
}

function backToStocks(){
    document.getElementById("stockDetails").style.display="none";
    document.getElementById("stocks").style.display="block";
}

function backToDetails(){
    document.getElementById("chartPage").style.display="none";
    document.getElementById("stockDetails").style.display="block";
}

/* ===== LANGUAGE SYSTEM ===== */
let arabic = false;

function toggleLang(){

    arabic = !arabic;

    if(arabic){
        document.body.dir="rtl";

        document.getElementById("title").innerText="جلوبال تريد";
        document.getElementById("loginBtn").innerText="تسجيل الدخول";
        document.getElementById("guestBtn").innerText="الدخول كزائر";
        document.getElementById("dashboardTitle").innerText="لوحة التحكم";

    } else {
        document.body.dir="ltr";

        document.getElementById("title").innerText="Global Trade";
        document.getElementById("loginBtn").innerText="Login";
        document.getElementById("guestBtn").innerText="Enter as Guest";
        document.getElementById("dashboardTitle").innerText="Dashboard";
    }
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL TRADE LTD | OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --navy: #020617; --card: #0f172a; --emerald: #10b981; --red: #ef4444; }
        * { box-sizing: border-box; font-family: 'Inter', 'Arial', sans-serif; transition: 0.3s; }
        
        body, html { height: 100%; margin: 0; background: var(--navy); color: white; overflow: hidden; display: flex; flex-direction: column; }

        /* HEADER TICKER */
        .ticker-wrap { background: #000; border-bottom: 1px solid var(--gold); height: 40px; overflow: hidden; }

        /* NAVIGATION - THE ORIGINAL STYLE */
        nav { height: 80px; display: flex; align-items: center; justify-content: center; gap: 20px; background: rgba(0,0,0,0.9); border-bottom: 1px solid #1e293b; }
        .nav-btn { background: transparent; border: 1px solid #1e293b; color: #94a3b8; padding: 12px 25px; cursor: pointer; font-weight: 900; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        .nav-btn.active { color: var(--gold); border-color: var(--gold); background: rgba(212, 175, 55, 0.1); }

        /* CONTENT ENGINE */
        main { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 20px; }
        .view { display: none; width: 95%; max-width: 1200px; height: 80vh; align-items: center; justify-content: center; gap: 30px; }
        .view.active { display: flex; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* PANELS */
        .panel { background: var(--card); border: 1px solid #1e293b; border-radius: 15px; padding: 30px; flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        .big-title { font-family: 'Cinzel', serif; font-size: 30px; color: var(--gold); margin-bottom: 20px; text-align: center; }
        
        /* INPUTS */
        .input-box { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #334155; color: white; border-radius: 8px; text-align: center; font-size: 16px; }
        .btn-action { background: var(--gold); color: black; border: none; padding: 15px 40px; font-weight: 900; cursor: pointer; border-radius: 8px; width: 100%; margin-top: 10px; }
        
        /* LOGO BOX */
        .trust-grid { display: flex; gap: 20px; margin-top: 30px; opacity: 0.5; filter: grayscale(1) invert(1); }
        .trust-grid img { height: 20px; }

        .balance-text { font-size: 60px; font-weight: 900; color: var(--emerald); margin: 10px 0; }
    </style>
</head>
<body>

<div class="ticker-wrap">
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
    {
        "symbols": [
            {"proName": "FX_IDC:USDLYD", "title": "USD/LYD"},
            {"proName": "BITSTAMP:BTCUSD", "title": "BTC/USD"},
            {"proName": "OANDA:XAUUSD", "title": "ذهب"},
            {"proName": "FOREXCOM:EURUSD", "title": "EUR/USD"}
        ],
        "colorTheme": "dark", "isTransparent": true, "displayMode": "adaptive", "locale": "ar"
    }
    </script>
</div>

<nav>
    <button class="nav-btn active" onclick="openTab('v-home', this)">المحفظة</button>
    <button class="nav-btn" onclick="openTab('v-trade', this)">التداول المباشر</button>
    <button class="nav-btn" onclick="openTab('v-fx', this)">مكتب الصرف</button>
    <button class="nav-btn" onclick="openTab('v-info', this)">حول الشركة</button>
</nav>

<main>
    <div id="v-home" class="view active">
        <div class="panel">
            <h1 class="big-title">GLOBAL TRADE LTD</h1>
            <p style="color:#94a3b8;">إجمالي القيمة السوقية الحالية</p>
            <div class="balance-text">$10,000.00</div>
            <button class="btn-action" onclick="wa('Deposit')">إيداع / تمويل الحساب</button>
            <div class="trust-grid">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg">
                <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg">
            </div>
            <p style="font-size: 10px; color: var(--gold); margin-top: 20px;">CBL | JUMHOURIA | SAHARA BANK</p>
        </div>
    </div>

    <div id="v-trade" class="view">
        <div class="panel" style="flex: 2; padding: 0; overflow: hidden;">
            <iframe src="https://www.tradingview.com/widgetembed/?symbol=NASDAQ%3ATSLA&theme=dark&locale=ar" style="width:100%; height:100%; border:none;"></iframe>
        </div>
        <div class="panel">
            <h3 style="color:var(--gold);">تنفيذ أمر تداول</h3>
            <input type="text" class="input-box" id="symbol" placeholder="رمز السهم (مثال: BTC)">
            <input type="number" class="input-box" id="amount" placeholder="الكمية">
            <button class="btn-action" style="background:var(--emerald); color:white;" onclick="order('BUY')">شراء / BUY</button>
            <button class="btn-action" style="background:var(--red); color:white;" onclick="order('SELL')">بيع / SELL</button>
        </div>
    </div>

    <div id="v-fx" class="view">
        <div class="panel">
            <h1 class="big-title">مكتب الصرف</h1>
            <input type="number" class="input-box" id="usd-in" placeholder="أدخل مبلغ بالدولار" oninput="calc()">
            <div id="lyd-out" style="font-size:35px; color:var(--emerald); font-weight:900; margin:20px 0;">0.00 LYD</div>
            <button class="btn-action" onclick="wa('FX_Swap')">تأكيد عملية الصرف</button>
        </div>
    </div>

    <div id="v-info" class="view">
        <div class="panel">
            <h1 class="big-title">تواصل معنا</h1>
            <button class="btn-action" style="background:white; color:black;" onclick="playAudio()">تشغيل الإيجاز الصوتي 🎙️</button>
            <h2 style="margin-top:40px;">واتساب: +218 91 570 9015</h2>
            <p style="color:#94a3b8;">نحن نوفر السيولة العالمية بأمان واحترافية</p>
            <button class="btn-action" onclick="wa('Support')">تحدث مع المدير</button>
        </div>
    </div>
</main>

<script>
    function openTab(id, btn) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    function calc() {
        const val = document.getElementById('usd-in').value;
        document.getElementById('lyd-out').innerText = (val * 7.34).toFixed(2) + " LYD";
    }

    function order(type) {
        const sym = document.getElementById('symbol').value;
        const amt = document.getElementById('amount').value;
        if(!sym || !amt) return alert("يرجى ملء البيانات");
        window.location.href = `https://wa.me/218915709015?text=طلب_${type}_${amt}_${sym}`;
    }

    function wa(ref) {
        window.location.href = `https://wa.me/218915709015?text=استفسار_من_المنصة_${ref}`;
    }

    function playAudio() {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance("مرحباً بكم في جلوبال تريد ليميتد. نحن وجهتكم الأولى والآمنة للتمويل والتحويل الدولي. معنا، يمكنك إرسال واستلام الأموال في جميع أنحاء العالم بكل سهولة وثقة. ثقتكم هي رأس مالنا.");
        msg.lang = 'ar-SA';
        msg.rate = 0.8;
        window.speechSynthesis.speak(msg);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Global Trade Capital</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#f4f6f9;}
header{background:#0b1d3a;color:#fff;padding:15px;text-align:center;}
.container{padding:20px;}
.card{background:white;padding:15px;border-radius:10px;margin-bottom:15px;box-shadow:0 3px 10px rgba(0,0,0,0.2);}
button{padding:8px;border:none;border-radius:6px;background:#0b1d3a;color:white;margin:3px;}
input{padding:8px;margin:5px;}
</style>
</head>

<body>

<header>Global Trade Capital</header>

<div class="container" id="auth"></div>
<div class="container" id="app" style="display:none;"></div>

<script>

// ===== USER SYSTEM =====
function showAuth(){
document.getElementById("auth").innerHTML=`
<div class="card">
<h2>Login</h2>
<input id="loginUser" placeholder="Username">
<input id="loginPass" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<h3>Register</h3>
<input id="regUser" placeholder="Username">
<input id="regPass" type="password" placeholder="Password">
<button onclick="register()">Register</button>
</div>
`;
}

function register(){
let u=document.getElementById("regUser").value;
let p=document.getElementById("regPass").value;

if(!u || !p) return alert("Enter details");

localStorage.setItem("user_"+u, JSON.stringify({
password:p,
balance:1000,
portfolio:{},
history:[]
}));

alert("Registered!");
}

function login(){
let u=document.getElementById("loginUser").value;
let p=document.getElementById("loginPass").value;

let user=JSON.parse(localStorage.getItem("user_"+u));

if(user && user.password===p){
localStorage.setItem("currentUser", u);
loadApp();
}else{
alert("Wrong login");
}
}

// ===== APP =====
function loadApp(){
document.getElementById("auth").style.display="none";
document.getElementById("app").style.display="block";

let u=localStorage.getItem("currentUser");
let user=getUser();

document.getElementById("app").innerHTML=`
<div class="card">
<h2>Welcome ${u}</h2>
<p>Balance: $${user.balance}</p>
<button onclick="addFunds()">+ Add $100</button>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h2>Send Money</h2>
<input id="toUser" placeholder="Recipient username">
<input id="amount" placeholder="Amount">
<button onclick="sendMoney()">Send</button>
</div>

<div class="card">
<h2>Crypto Trading</h2>
<div id="crypto"></div>
</div>

<div class="card">
<h2>Your Portfolio</h2>
<div id="portfolio"></div>
</div>

<div class="card">
<h2>Soccer Market</h2>
<button onclick="bet(50)">Bet $50</button>
</div>

<div class="card">
<h2>Transactions</h2>
<div id="history"></div>
</div>
`;

loadCrypto();
loadPortfolio();
loadHistory();
}

// ===== CRYPTO =====
function loadCrypto(){
axios.get("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd")
.then(res=>{
let html="";
res.data.slice(0,5).forEach(c=>{
html+=`
<p>${c.name}: $${c.current_price}
<button onclick="buy('${c.id}',${c.current_price})">Buy</button>
<button onclick="sell('${c.id}',${c.current_price})">Sell</button>
</p>`;
});
document.getElementById("crypto").innerHTML=html;
});
}

// ===== WALLET =====
function getUser(){
let u=localStorage.getItem("currentUser");
return JSON.parse(localStorage.getItem("user_"+u));
}

function saveUser(data){
let u=localStorage.getItem("currentUser");
localStorage.setItem("user_"+u, JSON.stringify(data));
}

// ===== SEND MONEY =====
function sendMoney(){
let to=document.getElementById("toUser").value;
let amt=parseFloat(document.getElementById("amount").value);

let sender=getUser();
let receiver=JSON.parse(localStorage.getItem("user_"+to));

if(!receiver) return alert("User not found");
if(sender.balance<amt) return alert("Not enough balance");

sender.balance-=amt;
receiver.balance+=amt;

sender.history.push(`Sent $${amt} to ${to}`);
receiver.history.push(`Received $${amt} from ${localStorage.getItem("currentUser")}`);

saveUser(sender);
localStorage.setItem("user_"+to, JSON.stringify(receiver));

loadApp();
}

// ===== TRADING =====
function buy(coin,price){
let user=getUser();
if(user.balance<price) return alert("Not enough money");

user.balance-=price;
user.portfolio[coin]=(user.portfolio[coin]||0)+1;
user.history.push(`Bought ${coin}`);
saveUser(user);
loadApp();
}

function sell(coin,price){
let user=getUser();
if(!user.portfolio[coin]) return alert("No asset");

user.balance+=price;
user.portfolio[coin]-=1;
user.history.push(`Sold ${coin}`);
saveUser(user);
loadApp();
}

// ===== PORTFOLIO =====
function loadPortfolio(){
let user=getUser();
let html="";
for(let coin in user.portfolio){
html+=`<p>${coin}: ${user.portfolio[coin]}</p>`;
}
document.getElementById("portfolio").innerHTML=html||"No assets";
}

// ===== BET =====
function bet(amount){
let user=getUser();
if(user.balance<amount) return alert("Not enough");

user.balance-=amount;
user.history.push(`Bet $${amount}`);
saveUser(user);
loadApp();
}

// ===== HISTORY =====
function loadHistory(){
let user=getUser();
document.getElementById("history").innerHTML=
user.history.map(h=>"<p>"+h+"</p>").join("");
}

// ===== LOGOUT =====
function logout(){
localStorage.removeItem("currentUser");
location.reload();
}

// INIT
if(localStorage.getItem("currentUser")){
loadApp();
}else{
showAuth();
}

</script>

</body>
</html>
